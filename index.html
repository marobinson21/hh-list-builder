  {id:"nullify", name:"Nullify", needs:["Psyker"],
    text:"<b>Trigger:</b> When one of your units within line of sight of this Psyker fails a Resistance Check against a Psychic Curse.<br><b>Cost:</b> 1 Reaction Point.<br><b>Target:</b> The failing unit and this Psyker.<br><b>Effect:</b> Subtract the Willpower Characteristic of the source of the Psychic Curse from the Willpower Characteristic of this Psyker. This is the Power Modifier for this reaction — it may be negative if the enemy Psyker has a higher Willpower.<br><br>This Psyker then makes a Willpower Check, applying the Power Modifier to the roll.<br><br>If the Willpower Check is successful, the Psychic Curse fails, and may not be reattempted this turn."},
  {id:"evade", name:"Evade", needs:["Light","Cavalry"],
    text:"<b>Restriction:</b> Every model in this unit must be either Light or Cavalry, and must not currently be locked in combat.<br><b>Trigger:</b> When this unit is being charged, after Volley Fire is finished.<br><b>Cost:</b> 1 Reaction Point.<br><b>Target:</b> The unit being charged.<br><b>Effect:</b> This unit may immediately move a number of inches equal to its Initiative Characteristic. If this move puts it outside of the maximum possible charge range, the Charge now fails."},
  {id:"concealed_ambush", name:"Concealed Ambush", needs:["Concealed Positions"],
    text:"<b>Restriction:</b> All models in this unit must have the Concealed Positions rule, and this unit must be in Reserves.<br><b>Trigger:</b> After any enemy unit ends a move.<br><b>Cost:</b> 1 Reaction Point.<br><b>Target:</b> This unit.<br><b>Effect:</b> Select one model from this unit and place it on the Battlefield within 6\" of the enemy unit that triggered this reaction. It must be at least 5\" away from any enemy model, at least 1\" away from any Battlefield Edge or Impassable Terrain, and outside of the enemy Deployment Zone. After placing this model, set up the remainder of the unit within 6\" of the first model placed, with the same restrictions as above.<br><br>After placing this unit, you may either:<br>• Immediately make a Shooting attack with this unit against the triggering enemy unit, with all attacks made as Snap Shots, or<br>• Immediately make a Disordered Charge against the triggering enemy unit."},
];

function reactBase(s){ return String(s||'').replace(/\s*\([^)]*\)\s*$/,'').trim(); }

// All trait/rule/type/weapon tokens present anywhere in the unit (base names).
function unitReactionTokens(u, cfg){
  const set=new Set(); const add=x=>{ if(x) set.add(reactBase(x)); };
  playCollectRules(u,cfg).forEach(add);
  (u.traits||[]).forEach(add);
  playCollectTypes(u,cfg).forEach(add);
  const lo=playLoadout(u,cfg);
  [...lo.ranged,...lo.melee].forEach(e=>{ const w=e.w;
    (w.rules||[]).forEach(add);
    if(w.specialRules&&w.specialRules!=='—') w.specialRules.split(',').forEach(s=>add(s.trim()));
    (w.profiles||[]).forEach(p=>{ (p.rules||[]).forEach(add);
      if(p.specialRules&&p.specialRules!=='—') p.specialRules.split(',').forEach(s=>add(s.trim())); });
  });
  return set;
}

function unitQualifiesReaction(u, cfg, r){
  const toks=unitReactionTokens(u,cfg);
  return (r.needs||[]).some(n=>toks.has(reactBase(n)));
}

function togglePlayReaction(id){ ST.reactOpen=ST.reactOpen||{}; ST.reactOpen[id]=!ST.reactOpen[id]; render(); }

function playReactions(u, cfg){
  const qual = ADVANCED_REACTIONS.filter(r=>unitQualifiesReaction(u,cfg,r));
  if(!qual.length) return '';
  return `<div class="pm-section-h">ADVANCED REACTIONS</div>`+qual.map(r=>{
    const open = !!(ST.reactOpen && ST.reactOpen[r.id]);
    return `<div class="pm-react">
      <div class="pm-react-h" onclick="togglePlayReaction('${esc(r.id)}')">
        <span>Advanced Reaction: ${r.name}</span><span class="pm-react-chev">${open?'⌃':'⌄'}</span>
      </div>
      ${open?`<div class="pm-react-t">${r.text||''}</div>`:''}
    </div>`;
  }).join('');
}

function playEquipmentSection(labels){
  const items=[...new Set(labels)].filter(l => l && !weaponKeyFromLabel(l) &&
    ((typeof EQUIPMENT!=='undefined' && EQUIPMENT[l]) || playRuleText(l)));
  if(!items.length) return '';
  return `<div class="pm-section-h">EQUIPMENT</div>`+items.map(it=>{
    const txt=playRuleText(it);
    return `<div class="pm-ability"><div class="pm-ability-n">${it}</div>`+
      (txt?`<div class="pm-ability-t">${txt}</div>`:'')+`</div>`;
  }).join('');
}

function playTraitPills(u, cfg, extra){
  const resolveTrait = t => t==='[Allegiance]'?(ST.allegiance||'Loyalist'):t==='[Legiones Astartes]'?(ST.legion||'Legion'):t;
  const types = playCollectTypes(u, cfg, extra);
  const traits = [...(u.traits||[]), ...((extra&&extra.traits)||[])];
  const pills = [];
  types.forEach(t=>pills.push(`<span class="pm-pill">${t}</span>`));
  traits.forEach(t=>pills.push(`<span class="pm-pill ghost">${resolveTrait(t)}</span>`));
  return pills.length?`<div class="pm-dtraits">${pills.join('')}</div>`:'';
}

function renderPlayTopbar(left){
  const tp=totalPts(); const ov=tp>ST.pts;
  return `<div class="pm-topbar">${left}
    <div class="pm-pts"><span class="${ov?'over':''}">${tp}</span> / ${ST.pts} pts</div>
    <button class="pm-back" onclick="exitPlay()">✎ Builder</button></div>`;
}

function renderRiteOfWar(){
  const rite = LEGION_RITES[ST.legion] || {};
  const open = !!ST.riteOpen;
  const sub = ST.riteSub || {};
  const entry = (key, label, e) => {
    const isOpen = !!sub[key];
    const name = (e && e.name) ? e.name : '—';
    const text = (e && e.text) ? e.text
      : `<span style="color:var(--text-muted);font-style:italic;">Not yet entered for ${ST.legion}.</span>`;
    return `<div class="pm-rite-sub">
      <div class="pm-rite-subh" onclick="toggleRiteSub('${key}')">
        <span class="pm-rite-lab"><b>${label}:</b> ${name}</span><span class="pm-rite-chev">${isOpen?'⌃':'⌄'}</span>
      </div>
      ${isOpen?`<div class="pm-rite-body">${text}</div>`:''}
    </div>`;
  };
  return `<div class="pm-sec">
    <div class="pm-sec-h" onclick="toggleRite()"><span>Rite of War</span><span>${open?'⌃':'⌄'}</span></div>
    ${open ? (
      entry('tactica','Legion Tactica', rite.tactica) +
      entry('gambit','Gambit', rite.gambit) +
      entry('reaction','Reaction', rite.reaction)
    ) : ''}
  </div>`;
}

function renderPlayRoster(){
  const units = playCollectUnits();
  let body;
  if(!units.length){
    body = `<div class="pm-empty">No units in your list yet. Switch to the builder and add some.</div>`;
  } else {
    const byRole = {};
    units.forEach(x=>{ (byRole[x.role]=byRole[x.role]||[]).push(x); });
    const roles = Object.keys(byRole).sort((a,b)=>{
      const ia=PLAY_ROLE_ORDER.indexOf(a), ib=PLAY_ROLE_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
    body = roles.map(role=>{
      const collapsed = ST.playCollapsed && ST.playCollapsed[role];
      const rows = collapsed ? '' : byRole[role].map(x=>{
        const wg = activeWargear(x.u, x.cfg);
        const size = wg.perModel ? (x.cfg.size||x.u.minSize||1) : 1;
        const adv = x.pa ? PA.find(a=>a.id===x.pa) : null;
        const pills = [`<span class="pm-pill">${cp(x.u,x.cfg)} pts</span>`];
        if(size>1) pills.push(`<span class="pm-pill ghost">${size} models</span>`);
        if(adv) pills.push(`<span class="pm-pill pa">${adv.label}</span>`);
        return `<div class="pm-row" onclick="openPlayUnit('${esc(x.iid)}','${esc(x.key)}')">
          <div class="pm-row-l"><span class="pm-uname">${x.u.name}</span><div class="pm-pills">${pills.join('')}</div></div>
          <span class="pm-chev-r">›</span></div>`;
      }).join('');
      return `<div class="pm-sec">
        <div class="pm-sec-h" onclick="togglePlaySec('${esc(role)}')">
          <span>${roleDisplay(role)}</span><span>${collapsed?'⌄':'⌃'}</span></div>
        ${rows}</div>`;
    }).join('');
  }
  document.getElementById("app").innerHTML =
    `<div class="app pm-wrap">${renderPlayTopbar(`<span class="pm-title" style="font-family:'Cinzel',serif;font-size:16px;color:var(--gold-light);">${ST.legion} · ${ST.allegiance}</span>`)}${renderRiteOfWar()}${body}</div>`;
}

function renderPlayDatasheet(){
  const r = playResolve(ST.playSel.iid, ST.playSel.key);
  if(!r){ backToRoster(); return; }
  const {u, cfg, def, role, pa} = r;
  const wg = activeWargear(u, cfg);
  const size = wg.perModel ? (cfg.size||u.minSize||1) : 1;
  const adv = pa ? PA.find(a=>a.id===pa) : null;
  const pg = (adv && adv.grants) || {};   // PA-granted types/specialRules/traits → fold into the displayed unit
  const load = playLoadout(u, cfg);

  const subParts = [];
  if(size>1) subParts.push(size+' models');
  subParts.push(roleDisplay(role));
  if(def) subParts.push(def.name);

  const sb = adv && adv.statBonus;
  const statsH = playStatLines(u, cfg, !!sb).map(l => {
    let stats = l.stats, mod = null;
    if (sb && (sb.scope==='all' || (sb.scope==='lead' && (l.kind==='champion' || l.kind==='single')))) {
      const res = applyPaDeltas(l.stats, sb.deltas, sb.cap);
      stats = res.stats; mod = res.modified;
    }
    return (l.label?`<div class="pm-statline-l">${l.label}</div>`:'')+playStatBoxes(stats, mod);
  }).join('');

  const compH = playComposition(u, cfg);

  const paH = adv
    ? `<div class="pm-section-h">PRIME ADVANTAGE</div><div class="pm-ability"><div class="pm-ability-n">${adv.label}</div><div class="pm-ability-t">${adv.desc||''}</div></div>`
    : '';

  const weaponsH = (load.ranged.length||load.melee.length)
    ? `<div class="pm-section-h">WEAPONS</div>`+playWeaponTable(load.ranged,false)+playWeaponTable(load.melee,true)
    : '';

  const equipH = playEquipmentSection(load.gearLabels);

  const body = `
    <div class="pm-dh">${u.name}</div>
    <div class="pm-dsub">${cp(u,cfg)} pts · ${subParts.join(' · ')}</div>
    ${playTraitPills(u, cfg, pg)}
    ${statsH}
    ${paH}
    ${compH}
    ${weaponsH}
    ${equipH}
    ${playAbilities(u, cfg, pg)}
    ${playTypes(u, cfg, pg)}
    ${playReactions(u, cfg)}`;

  document.getElementById("app").innerHTML =
    `<div class="app pm-wrap">${renderPlayTopbar(`<button class="pm-back" onclick="backToRoster()">‹ Roster</button>`)}${body}</div>`;
}

function renderPlay(){
  if(ST.playSel) renderPlayDatasheet();
  else renderPlayRoster();
}

function render(){
  if(ST.view==='play'){ renderPlay(); return; }
  const tp=totalPts();const pct=Math.min(100,Math.round((tp/ST.pts)*100));const ov=tp>ST.pts;
  const{ao,ax}=getUnlocks();const{a,b}=getUsed();
  document.getElementById("app").innerHTML=`
    <div class="app-header">
      <div>
        <div class="app-title">Horus Heresy 3.0 — List Builder</div>
        <div class="app-subtitle">Prototype · ${ST.legion} · ${ST.allegiance}</div>
      </div>
      <div class="header-btns">
        <button class="hbtn" onclick="enterPlay()">▶ Play Mode</button>
        <button class="hbtn save" onclick="toggleShare()">${ST.showShare?"▲ Hide":"⇧ Share / Import"}</button>
        <button class="hbtn" onclick="openAuth()">${cloud.currentUser()?("👤 "+esc((cloud.currentUser().email||"Account").split("@")[0])):"👤 Sign in"}</button>
      </div>
    </div>
    ${renderSharePanel()}
    <div class="ctrls">
      <div class="cg"><span class="cl">Allegiance</span>
        <select onchange="ST.allegiance=this.value;saveAndRender()">
          <option${ST.allegiance==="Loyalist"?" selected":""}>Loyalist</option>
          <option${ST.allegiance==="Traitor"?" selected":""}>Traitor</option>
        </select></div>
      <div class="cg"><span class="cl">Legion</span>
        <select onchange="ST.legion=this.value;saveAndRender()">
          ${["Dark Angels","Emperor's Children","Iron Warriors","White Scars","Space Wolves","Imperial Fists","Night Lords","Blood Angels","Iron Hands","World Eaters","Ultramarines","Death Guard","Thousand Sons","Sons of Horus","Word Bearers","Salamanders","Raven Guard","Alpha Legion"].map(L=>`<option${ST.legion===L?" selected":""}>${L}</option>`).join("")}
        </select></div>
      <div class="cg"><span class="cl">Points Limit</span>
        <input type="number" value="${ST.pts}" min="500" max="10000" step="500"
          onchange="ST.pts=parseInt(this.value)||3000;saveAndRender()" style="width:90px"/></div>
    </div>
    <div class="pts-bar">
      <span class="pts-lbl">Points</span>
      <span class="pts-val" style="${ov?"color:#f06060":""}">${tp}</span>
      <span class="pts-lbl">/ ${ST.pts}</span>
      <div class="pts-fill"><div class="pts-inner${ov?" over":""}" style="width:${pct}%"></div></div>
      <span style="font-size:13px;color:var(--gold-light)">Unlocks: ${a+b}/${ao+ax}</span>
    </div>
    <div class="army">
      ${ST.dets.map(renderCard).join("")}
      ${renderPool()}
    </div>
    ${renderModal()}
    ${renderAuthModal()}`;
}
function attachClickHandlers() {
  const app = document.getElementById('app');
  if (!app) return;
  // Remove old listener by cloning
  const fresh = app.cloneNode(true);
  app.parentNode.replaceChild(fresh, app);
  fresh.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    const iid = el.dataset.iid;
    const i = parseInt(el.dataset.i);
    if (act === 'pm-slot') {
      setPerModelSlot(iid, i, el.dataset.mkey, el.dataset.slotid, el.dataset.optid);
      ST.modal = unitModalObj(iid,i);
      render();
    } else if (act === 'slot-opt') {
      setSlotOption(iid, i, el.dataset.slotid, el.dataset.optid);
      ST.modal = unitModalObj(iid,i);
      render();
    }
  });
}

// Patch render() to call attachClickHandlers after each render
const _origRender = render;
render = function() {
  // Preserve scroll position so making a selection doesn't jump the modal/page to the top.
  const ov = document.querySelector('.ov');
  const ovSc = ov ? ov.scrollTop : null;
  const winSc = window.scrollY;
  _origRender();
  attachClickHandlers();
  if (ovSc != null) { const o = document.querySelector('.ov'); if (o) o.scrollTop = ovSc; }
  else { window.scrollTo(0, winSc); }
};

/* ============================================================================
 *  CLOUD ACCOUNTS + LIST STORAGE  (Supabase, pure fetch — no SDK)
 *  ---------------------------------------------------------------------------
 *  SETUP (one-time, ~5 min): create a FREE Supabase project, run the SQL from
 *  HH_ACCOUNTS_ARCHITECTURE.md (creates the `lists` table + Row Level Security),
 *  enable Email auth, then paste your project URL + public "anon" key below.
 *  Both values are SAFE to commit publicly: RLS guarantees a signed-in user can
 *  only ever read/write their OWN rows. NEVER put the service_role key here.
 * ========================================================================== */
const SUPABASE_URL  = "https://aejklplcpxmuqjspemtm.supabase.co";   // e.g. "https://abcdefgh.supabase.co"  (Project Settings → API)
const SUPABASE_ANON = "sb_publishable_vxr5UuzypP1Lc_nPAz9BNw_3D35PYNm";   // the public "anon" key                (Project Settings → API)

const cloud = (() => {
  const SKEY = "hh_cloud_session";
  let session = null;                 // {access_token, refresh_token, expires_at, user}
  const listeners = [];

  const isConfigured = () => !!(SUPABASE_URL && SUPABASE_ANON);
  const currentUser  = () => (session && session.user) ? session.user : null;
  const onAuthChange = (cb) => { listeners.push(cb); return cb; };
  const emit = () => listeners.forEach(cb=>{ try{ cb(currentUser()); }catch(e){ console.error(e); } });

  function persist(){ try{ session ? localStorage.setItem(SKEY, JSON.stringify(session)) : localStorage.removeItem(SKEY); }catch(e){} }
  function setSession(s){
    session = (s && s.access_token)
      ? { access_token:s.access_token, refresh_token:s.refresh_token,
          expires_at: Date.now() + ((s.expires_in||3600)*1000), user:s.user||null }
      : null;
    persist(); emit();
  }

  // --- auth (GoTrue) ---
  async function authFetch(path, body, method){
    const res = await fetch(SUPABASE_URL + path, {
      method: method||"POST",
      headers:{ "apikey":SUPABASE_ANON, "Content-Type":"application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error_description || data.msg || data.message || ("Request failed ("+res.status+")"));
    return data;
  }
  async function signUp(email, password){
    const d = await authFetch("/auth/v1/signup", {email, password});
    if(d.access_token) setSession(d);   // email-confirm OFF → instant session; ON → confirm first
    return d;
  }
  async function signIn(email, password){
    const d = await authFetch("/auth/v1/token?grant_type=password", {email, password});
    setSession(d); return d;
  }
  const resetPassword = (email) => authFetch("/auth/v1/recover", {email});
  async function refresh(){
    if(!session || !session.refresh_token){ setSession(null); return null; }
    try{ setSession(await authFetch("/auth/v1/token?grant_type=refresh_token", {refresh_token:session.refresh_token})); return session; }
    catch(e){ setSession(null); return null; }
  }
  async function signOut(){
    try{ if(session) await fetch(SUPABASE_URL+"/auth/v1/logout", {method:"POST", headers:{ "apikey":SUPABASE_ANON, "Authorization":"Bearer "+session.access_token }}); }catch(e){}
    setSession(null);
  }
  async function init(){
    try{ const raw=localStorage.getItem(SKEY); if(raw) session=JSON.parse(raw); }catch(e){ session=null; }
    if(session){ (Date.now() > session.expires_at - 60000) ? await refresh() : emit(); }
  }
  async function token(){
    if(!session) return null;
    if(Date.now() > session.expires_at - 60000) await refresh();
    return session ? session.access_token : null;
  }

  // --- data (PostgREST) ---
  async function dataFetch(path, {method, body, prefer}={}){
    let t = await token(); if(!t) throw new Error("Not signed in.");
    const hdr = () => { const h={ "apikey":SUPABASE_ANON, "Authorization":"Bearer "+session.access_token, "Content-Type":"application/json" }; if(prefer) h["Prefer"]=prefer; return h; };
    let res = await fetch(SUPABASE_URL+"/rest/v1"+path, { method:method||"GET", headers:hdr(), body: body?JSON.stringify(body):undefined });
    if(res.status===401){ await refresh(); if(session){ res = await fetch(SUPABASE_URL+"/rest/v1"+path, { method:method||"GET", headers:hdr(), body: body?JSON.stringify(body):undefined }); } }
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||e.hint||("Request failed ("+res.status+")")); }
    if(res.status===204) return null;
    return res.json().catch(()=>null);
  }
  const listLists  = ()           => dataFetch("/lists?select=id,name,legion,allegiance,points,updated_at&order=updated_at.desc");
  const loadList   = (id)         => dataFetch("/lists?id=eq."+encodeURIComponent(id)+"&select=data").then(r => (r&&r[0]) ? r[0].data : null);
  const createList = (meta, data) => dataFetch("/lists", {method:"POST", prefer:"return=representation", body:{...meta, data}}).then(r => (r&&r[0]) ? r[0] : null);
  const updateList = (id, meta, data) => { const b={...meta}; if(data!=null) b.data=data; return dataFetch("/lists?id=eq."+encodeURIComponent(id), {method:"PATCH", prefer:"return=representation", body:b}).then(r => (r&&r[0]) ? r[0] : null); };
  const renameList = (id, name)   => dataFetch("/lists?id=eq."+encodeURIComponent(id), {method:"PATCH", body:{name}});
  const deleteList = (id)         => dataFetch("/lists?id=eq."+encodeURIComponent(id), {method:"DELETE"});

  return { isConfigured, currentUser, onAuthChange, init, signUp, signIn, resetPassword, signOut, refresh,
           listLists, loadList, createList, updateList, renameList, deleteList };
})();

/* ── Auth UI ─────────────────────────────────────────────────────────────── */
function _auth(){ if(!ST.auth) ST.auth={open:false, mode:"signin", busy:false, err:"", msg:""}; return ST.auth; }
function openAuth(){ const a=_auth(); a.open=true; a.err=""; a.msg=""; a.busy=false; render(); }
function closeAuth(){ const a=_auth(); a.open=false; a.err=""; a.msg=""; render(); }
function authMode(m){ const a=_auth(); a.mode=m; a.err=""; a.msg=""; render(); }
async function authSubmit(){
  const a=_auth();
  const email=((document.getElementById("auth-email")||{}).value||"").trim();
  const pw=(document.getElementById("auth-pw")||{}).value||"";
  a.err=""; a.msg=""; a.busy=true; render();
  try{
    if(a.mode==="signin"){ await cloud.signIn(email, pw); a.open=false; }
    else if(a.mode==="signup"){
      await cloud.signUp(email, pw);
      if(cloud.currentUser()){ a.open=false; }
      else { a.msg="Account created — check your email to confirm, then sign in."; a.mode="signin"; }
    }
    else if(a.mode==="reset"){ await cloud.resetPassword(email); a.msg="If that email exists, a reset link is on its way."; }
  }catch(e){ a.err=e.message||"Something went wrong."; }
  a.busy=false; render();
}
async function authSignOut(){ await cloud.signOut(); const a=_auth(); a.open=false; render(); }

function renderAuthModal(){
  const a=_auth(); if(!a.open) return "";
  const wrap = (inner, w) => `<div class="ov" onclick="closeAuth()"><div class="mod" onclick="event.stopPropagation()" style="max-width:${w||420}px">
    <button class="mc" onclick="closeAuth()">✕</button>${inner}</div></div>`;
  if(!cloud.isConfigured()){
    return wrap(`<div class="mt">Accounts not set up</div>
      <div class="ms">Cloud accounts aren't configured yet.<br><span style="color:var(--gold-light);font-size:12px">(Developer: paste your Supabase URL &amp; anon key into <code>SUPABASE_URL</code> / <code>SUPABASE_ANON</code>.)</span></div>
      <div style="text-align:center;margin-top:14px"><button class="clrbtn" style="width:auto;padding:6px 22px" onclick="closeAuth()">↩ Close</button></div>`);
  }
  const u=cloud.currentUser();
  if(u){
    return wrap(`<div class="mt">Account</div>
      <div class="ms">Signed in as <b>${esc(u.email||"")}</b></div>
      <hr class="mdiv">
      <div style="color:var(--gold-light);font-size:13px;margin-bottom:14px">Saving &amp; loading your list library lands in the next update.</div>
      <div style="text-align:center"><button class="clrbtn" style="width:auto;padding:6px 22px" onclick="authSignOut()">Sign out</button></div>`);
  }
  const tab=(m,label)=>`<button onclick="authMode('${m}')" style="flex:1;padding:8px;background:${a.mode===m?'var(--gold)':'transparent'};color:${a.mode===m?'#1a1512':'var(--gold-light)'};border:1px solid var(--gold);cursor:pointer;font-family:'Cinzel',serif;font-size:13px;">${label}</button>`;
  const enter=`onkeydown="if(event.key==='Enter')authSubmit()"`;
  const field=(id,type,ph)=>`<input id="${id}" type="${type}" placeholder="${ph}" ${enter} autocomplete="${type==='password'?'current-password':'email'}" style="width:100%;box-sizing:border-box;padding:10px;margin:5px 0;background:#12100c;border:1px solid var(--gold);color:#e8e0cc;border-radius:3px;font-size:15px;">`;
  const title = a.mode==="signup"?"Create account":a.mode==="reset"?"Reset password":"Sign in";
  const cta   = a.busy?"…":(a.mode==="signup"?"Create account":a.mode==="reset"?"Send reset link":"Sign in");
  return wrap(`<div class="mt">${title}</div>
    ${a.mode!=="reset"?`<div style="display:flex;margin:10px 0 8px">${tab('signin','Sign in')}${tab('signup','Sign up')}</div>`:''}
    ${field('auth-email','email','Email')}
    ${a.mode!=="reset"?field('auth-pw','password','Password'):''}
    ${a.err?`<div style="color:#f06060;font-size:13px;margin:6px 0">${esc(a.err)}</div>`:''}
    ${a.msg?`<div style="color:#6fbf6f;font-size:13px;margin:6px 0">${esc(a.msg)}</div>`:''}
    <button class="clrbtn" style="width:100%;padding:11px;margin-top:8px" ${a.busy?'disabled':''} onclick="authSubmit()">${cta}</button>
    <div style="text-align:center;margin-top:12px;font-size:12px">
      ${a.mode==="reset"
        ? `<a href="#" onclick="authMode('signin');return false" style="color:var(--gold-light)">← Back to sign in</a>`
        : `<a href="#" onclick="authMode('reset');return false" style="color:var(--gold-light)">Forgot password?</a>`}
    </div>`, 400);
}

// Restore any saved session on load, and re-render whenever auth state changes.
cloud.onAuthChange(() => render());
cloud.init();

render();
setupDelegatedHovers();
</script>
