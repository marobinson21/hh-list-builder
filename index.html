  let addons = [...(sc.addons||[])];
  if (addons.includes(addonId)) {
    addons = addons.filter(id=>id!==addonId);
  } else {
    if (addon.exclusive) addons = addons.filter(id=>!addon.exclusive.includes(id));
    addons.push(addonId);
  }
  d.cfgs[i] = {...cfg, sergeant:{...sc, addons}};
  saveAndRender();
}


// ── Wargear modal ────────────────────────────────────────────────────────────
function renderWargearModal(det, slotIdx) {
  const u = det.slots[slotIdx];
  if (!u || u._missing) return renderMissingModal(det, slotIdx);
  const cfg = det.cfgs[slotIdx] || {};
  const wg = activeWargear(u, cfg);
  const profile = activeProfile(u, cfg);
  const typeInfo = activeType(u, cfg);
  const iid = det.iid;
  const totalCost = cp(u, cfg);
  const modelCount = cfg.size || u.minSize || 1;
  const typeStr = typeInfo.type
    ? `${typeInfo.type}${typeInfo.subtypes&&typeInfo.subtypes.length?' ('+typeInfo.subtypes.join(', ')+')':''}` : '';
  const specialRuleNote = "";
  const sizeDesc = (u.minSize||1) === (u.maxSize||1) ? "Single model"
    : u.baseSizeBreakdown
      ? `${modelCount} models · base: ${u.baseSizeBreakdown}`
      : `${modelCount} models (${u.minSize}–${u.maxSize})`;

  // Single-model units: stat line is reachable by hovering the unit name in the header.
  // (Multi-model units instead expose per-model stat hovers on each model section header.)
  const singleStats = (!wg.perModel) ? ((profile && profile.stats) ? profile.stats : (u.stats || null)) : null;
  const singleStatKey = 'stat_single_' + esc(iid) + '_' + slotIdx;
  if (singleStats) window[singleStatKey] = singleStats;
  const mtStatAttr = singleStats
    ? ' data-statkey="'+singleStatKey+'" style="cursor:help;border-bottom:1px dotted var(--gold-dark);display:inline-block;"'
    : '';

  let html = `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
    <button class="mc" onclick="closeModal()">✕</button>
    <div class="mt"${mtStatAttr}>${u.name}</div>
    <div class="ms">${sizeDesc}</div>
    ${specialRuleNote}`;

  // Traits / Types / Special Rules pills
  const activeProf2 = activeProfile(u, cfg);
  // Traits — unit level, no hover needed
  const dispTraits = u.traits||[];
  // Types — from active profile
  const dispTypes2 = activeProf2
    ? [activeProf2.type,...(activeProf2.subtypes||[])].filter(Boolean)
    : (u.modelTypes||[]);
  // Special Rules — from active profile, fall back to unit root
  const dispSpecial = (activeProf2&&activeProf2.specialRules&&activeProf2.specialRules.length)
    ? activeProf2.specialRules : (u.specialRules||[]);
  // Resolve [Allegiance] and [Legiones Astartes] tokens
  function resolveTraitLabel(t) {
    if (t==='[Allegiance]') return ST.allegiance||'Loyalist';
    if (t==='[Legiones Astartes]') return ST.legion||'Legion';
    return t;
  }
  // Grants (BUG-005 + wargear grants): merge grants from any active addon that carries them
  // — disciplines, and special wargear like the Saturnine Teleportation Transponder (grants Deep Strike)
  const grantedTraits=[], grantedSpecial=[], grantedWeapons=[], grantedPowers=[], grantedTypes=[];
  const pushGrants = (g) => { if(!g) return;
    (g.traits||[]).forEach(t=>grantedTraits.push(t));
    (g.types||[]).forEach(t=>grantedTypes.push(t));
    (g.specialRules||[]).forEach(r=>grantedSpecial.push(r));
    (g.weapons||[]).forEach(w=>grantedWeapons.push(w));
    (g.powers||[]).forEach(p=>grantedPowers.push(p));
  };
  (wg.addons||[]).forEach(addon => {
    if (addon.grants && (addon.always_on || (cfg.addons||[]).includes(addon.id))) pushGrants(addon.grants);
  });
  const allTraits  = [...new Set([...dispTraits,  ...grantedTraits])];
  const allSpecial = [...new Set([...dispSpecial, ...grantedSpecial])];
  const grantedWeaponsU = [...new Set(grantedWeapons)];
  const grantedPowersU  = [...new Set(grantedPowers)].map(p =>
    p === '[Anathemata Power]'
      ? (ST.allegiance === 'Traitor' ? 'Breach the Veil' : 'Seal the Veil')
      : p);
  if (allTraits.length) {
    html += '<div style="margin:.3rem 0 .2rem;display:flex;flex-wrap:wrap;gap:3px;">';
    allTraits.forEach(t => {
      html += '<span class="rule-pill trait">'+resolveTraitLabel(t)+'</span>';
    });
    html += '</div>';
  }
  // Type pills (BUG-002): multi-model units carry modelTypes on champion/perModel sub-blocks, labelled by role
  // Equipment-granted types/traits (e.g. Argyrum shield → Heavy/Shield) fold into the owning model's group.
  const champGrantTypes  = wg.perModel ? addonGrantedTypes(wg.champion, cfg.champion) : [];
  const champGrantTraits = wg.perModel ? addonGrantedTraits(wg.champion, cfg.champion) : [];
  const singleTypes = [...new Set([...dispTypes2, ...grantedTypes])];
  const typeGroups = [];
  if (wg.perModel) {
    const champTypes = [...new Set([...((wg.champion && wg.champion.modelTypes) || []), ...champGrantTypes])];
    const perModelTypes = (wg.perModel && wg.perModel.modelTypes) || [];
    if (isUniform(u)) {
      const merged = [...new Set([...champTypes, ...perModelTypes])];
      if (merged.length || champGrantTraits.length) typeGroups.push({label:'', types:merged, traits:champGrantTraits});
    } else {
      if (champTypes.length || champGrantTraits.length) typeGroups.push({label:(u.championLabel||'Champion'), types:champTypes, traits:champGrantTraits});
      if (perModelTypes.length) typeGroups.push({label:(u.baseModelLabel||'Model'), types:perModelTypes});
    }
    if (!typeGroups.length && singleTypes.length) typeGroups.push({label:'', types:singleTypes});
  } else if (singleTypes.length) {
    typeGroups.push({label:'', types:singleTypes});
  }
  typeGroups.forEach(g => {
    html += '<div style="margin:.2rem 0;display:flex;flex-wrap:wrap;gap:3px;align-items:center;">';
    g.types.forEach(t => {
      html += '<span class="rule-pill unit-type" data-rule="'+t.replace(/"/g,'&quot;')+'">'+t+'</span>';
    });
    (g.traits||[]).forEach(t => {
      html += '<span class="rule-pill trait">'+resolveTraitLabel(t)+'</span>';
    });
    if (g.label) html += '<span style="font-size:12px;color:var(--text-muted);font-family:\'Cinzel\',serif;margin-left:3px;">('+g.label+')</span>';
    html += '</div>';
  });
  if (allSpecial.length) {
    html += '<div style="margin:.2rem 0 .4rem;display:flex;flex-wrap:wrap;gap:3px;">';
    allSpecial.forEach(r => {
      html += '<span class="rule-pill special-rule" data-rule="'+r.replace(/"/g,'&quot;')+'">'+r+'</span>';
    });
    html += '</div>';
  }
  // Granted psychic weapons/powers from disciplines (BUG-005)
  const psychicItems = [...grantedWeaponsU.map(w=>({label:w,weapon:true})), ...grantedPowersU.map(p=>({label:p,weapon:false}))];
  if (psychicItems.length) {
    html += '<div style="margin:.2rem 0 .4rem;display:flex;flex-wrap:wrap;gap:3px;align-items:center;">';
    html += '<span style="font-size:12px;color:var(--text-muted);font-family:\'Cinzel\',serif;margin-right:2px;">Granted:</span>';
    psychicItems.forEach(pi => {
      const wa = pi.weapon ? (weaponHoverAttrs(pi.label)||'') : ('data-rule="'+pi.label.replace(/"/g,'&quot;')+'"');
      html += '<span class="rule-pill psychic" '+wa+'>'+pi.label+'</span>';
    });
    html += '</div>';
  }

  // Profile selector
  if (u.profiles && u.profiles.length > 1) {
    const profileBtns = u.profiles.map(p => {
      const isActive = (cfg.profileId||u.profiles[0].id) === p.id;
      const ptsLabel = p.pts > 0 ? ' +' + p.pts + ' pts' : p.pts < 0 ? ' ' + p.pts + ' pts' : '';
      const borderCol = isActive ? 'var(--gold-dark)' : 'var(--gold)';
      const bgCol     = isActive ? 'var(--gold-dark)' : 'var(--card-bg)';
      const txtCol    = isActive ? '#f5f0e4'          : 'var(--text-main)';
      const styleStr  = "font-family:'Cinzel',serif;font-size:13px;padding:5px 10px;border-radius:4px;cursor:pointer;" +
                        'border:1px solid ' + borderCol + ';background:' + bgCol + ';color:' + txtCol + ';';
      const onclick = 'switchProfile(\'' + esc(iid) + '\',' + slotIdx + ',\'' + p.id + '\')';
      const statKey2 = 'profstat_' + p.id;
      if (p.stats) window[statKey2] = p.stats;
      const statAttr = p.stats ? ' data-statkey="' + statKey2 + '"' : '';
      return '<button onclick="' + onclick + '"' + statAttr + ' style="' + styleStr + '">' +
             p.label + ptsLabel + '</button>';
    }).join('');
    html += '<div class="wg-section" style="margin-bottom:.75rem;">' +
            '<div class="wg-section-title">Profile</div>' +
            '<div style="display:flex;gap:.5rem;flex-wrap:wrap;">' + profileBtns + '</div>' +
            '</div><hr class="mdiv">';
  }

  // Size row
  if (u.maxSize > 1) {
    const sizeLabel = u.baseSizeBreakdown ? "Total models:" : "Models:";
    html += `<div class="wg-section">
      <div class="wg-section-title">Unit Size</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap;">
        <span style="color:var(--text-muted)">${sizeLabel}</span>
        <input style="width:60px;border:.5px solid var(--gold);background:var(--card-bg);color:var(--text-main);font-family:'Crimson Text',serif;font-size:15px;padding:3px 6px;border-radius:3px;"
          type="number" min="${u.minSize}" max="${u.maxSize}" value="${cfg.size||u.minSize}"
          onchange="setSize('${esc(iid)}',${slotIdx},this.value)"/>
        <span style="font-size:14px;color:var(--text-muted)">(${u.minSize}–${u.maxSize})</span>
        ${u.baseSizeBreakdown?`<span style="font-size:13px;color:var(--text-muted);font-style:italic;">base: ${u.baseSizeBreakdown}</span>`:''}
      </div>
    </div><hr class="mdiv">`;
  }

  // No separate "Standard Equipment" summary — included items shown inline in Weapon Options

  // Pair exchanges now shown inline on slot options

  // Single-model equipment summary as chips (mirrors per-model style); exchange pickers shown below
  if (!wg.perModel && ((wg.included_slots&&wg.included_slots.length)||(wg.slots&&wg.slots.length)||(cfg.addons&&cfg.addons.length)||cfg.pairExchange)) {
    const sChips=[];
    const slotLabelsLowerS=new Set((wg.slots||[]).map(s=>(s.label||'').toLowerCase()));
    const pairS = cfg.pairExchange ? (wg.pairs||[]).find(x=>x.id===cfg.pairExchange) : null;
    if (pairS) sChips.push({label:pairS.label,kind:'changed'});
    (wg.slots||[]).forEach(slot=>{
      if (pairS && (pairS.replaces||[]).includes(slot.id)) return;
      if (slotConsumedBy(wg, cfg, slot.id)) return; // replaced by a two-handed weapon
      const chosen=(cfg.slots||{})[slot.id];
      const chosenOpt = chosen ? resolveOption(slot,chosen) : null;
      if (chosenOpt) {
        if (chosenOpt.chips) chosenOpt.chips.forEach(w=>sChips.push({label:w,kind:'changed'}));
        else sChips.push({label:chosenOpt.label||chosen,kind:'changed'});
      } else if (slot.defaultChips) {
        slot.defaultChips.forEach(w=>sChips.push({label:w,kind:'default'}));
      } else sChips.push({label:slot.label,kind:'default'});
    });
    (wg.included_slots||[]).forEach(item=>{
      if (slotLabelsLowerS.has((item||'').toLowerCase())) return;
      sChips.push({label:resolveGearLabel(item),kind:'standard'});
    });
    (cfg.addons||[]).forEach(aid=>{
      const a=(wg.addons||[]).find(x=>x.id===aid);
      if (a && !a.discipline) sChips.push({label:a.label,kind:'changed'});
    });
    // discipline-granted weapons appear in the equipment list too (also in the Granted row at top)
    grantedWeaponsU.forEach(w=>sChips.push({label:w,kind:'granted'}));
    const cBaseS='display:inline-block;font-size:12px;line-height:1.4;padding:1px 7px;border-radius:9px;margin:1px 3px 1px 0;white-space:nowrap;';
    const cStyleS=(k)=>k==='changed'?cBaseS+'background:var(--gold-dark);color:#f5f0e4;border:.5px solid var(--gold);':k==='standard'?cBaseS+'background:transparent;color:var(--text-muted);border:.5px dashed #c9b98a;font-style:italic;':k==='granted'?cBaseS+'background:#2a1a2e;color:#cba8e0;border:.5px solid #b48ad4;':cBaseS+'background:#e8e0cc;color:var(--text-main);border:.5px solid #d4c88a;';
    if (sChips.length) {
      html += `<hr class="mdiv"><div class="wg-section"><div class="wg-section-title">Equipment</div><div>` +
        sChips.map(c=>'<span style="'+cStyleS(c.kind)+'" '+(weaponHoverAttrs(c.label)||'')+'>'+c.label+'</span>').join('') +
        `</div></div>`;
    }
  }

  // Weapon options — exchangeable slots (single-model included gear now shown as Equipment chips above)
  const hasWeaponSection = (wg.slots && wg.slots.length) || (wg.perModel && wg.included_slots && wg.included_slots.length);
  if (hasWeaponSection) {
    html += `<hr class="mdiv"><div class="wg-section"><div class="wg-section-title">Weapon Options</div>`;
    // Read-only included items (single-model units now show these as chips in the Equipment summary above)
    if (wg.perModel) (wg.included_slots || []).forEach(item => {
      const resolvedItem = resolveGearLabel(item);
      const equipKey = resolveGearEquipKey(item);
      const wAttrs = weaponHoverAttrs(equipKey) || weaponHoverAttrs(resolvedItem);
      html += `<div class="slot-row">
        <div class="slot-current" style="background:#f5f0e4;border:.5px solid #d4c88a;">
          <span class="slot-current-name" style="color:var(--text-muted);font-style:italic;" ${wAttrs}>${resolvedItem}</span>
          <span style="font-size:12px;color:var(--text-muted);">standard</span>
        </div>
      </div>`;
    });
    // Exchangeable slots
    if (wg.slots && wg.slots.length) {
    wg.slots.forEach(slot => {
      if (!isSlotActive(slot, cfg.addons||[])) return;
      const locked = slotLocked(wg, cfg, slot.id);
      const current = slotLabel(wg, cfg, slot);
      const isEmpty = current.isDefault && slot.required;
      const curWA = weaponHoverAttrs(current.isDefault ? slot.label : current.name);
      html += `<div class="slot-row">
        <div class="slot-current${isEmpty?' required-slot':''}">
          <span class="slot-current-name" ${curWA}>
            ${isEmpty ? `<span style="color:var(--red);font-weight:600;">⚠ Required: </span>` : ""}
            ${slot.label}${locked?` <span style="font-size:12px;color:var(--text-muted);font-weight:normal;">(replaced by ${current.name})</span>`:""}
          </span>
          ${!locked && !current.isDefault ? `<button class="slot-reset" onclick="setSlotOption('${esc(iid)}',${slotIdx},'${slot.id}',null)">↩ restore</button>` : ""}
        </div>`;
      // Pair exchanges for this slot — always visible so player can toggle
      (wg.pairs||[]).forEach(pair => {
        if (!(pair.replaces||[]).includes(slot.id)) return;
        const isPairSel = cfg.pairExchange === pair.id;
        const pairWA = weaponHoverAttrs(pair.label);
        html += `<div class="slot-option${isPairSel?' selected':''}" onclick="setPairExchange('${esc(iid)}',${slotIdx},'${pair.id}')" ${pairWA}>
          <span>${pair.label} <span style="font-size:12px;color:var(--text-muted);">(pair exchange — replaces both)</span></span>
          <span class="slot-option-pts">+${pair.pts} pts</span>
        </div>`;
      });
      if (!locked) {
        const allSlotOptions = [...slot.options, ...getFactionOptions(slot)];
        allSlotOptions.forEach(opt => {
          // Filter by legion, weapon availability, subtype
          if (!optionVisible(opt, u)) return;
          const isSelected = (cfg.slots||{})[slot.id] === opt.id;
          const isSharedUsed = opt.shared && sharedOptionUsed(wg, cfg, opt.id, slot.id);
          const isList = !!opt.list;
          const currentChoice = (cfg.slots||{})[slot.id];
          // Only active if the chosen item actually belongs to THIS option's list
          const currentListItem = isList && currentChoice ? findListItem(currentChoice) : null;
          const listIsActive = isList && currentListItem &&
            opt.list && (WARGEAR_LISTS[opt.list]||{items:[]}).items.some(i=>i.id===currentChoice);
          const effectiveSelected = isSelected || listIsActive;
          const displayLabel = listIsActive ? currentListItem.label : opt.label;
          const resolvedOpt = listIsActive ? currentListItem : opt;
          const displayPts = listIsActive
            ? (currentListItem.ptsPerModel ? `+${currentListItem.pts} pts/model (${currentListItem.pts*modelCount} total)` : (currentListItem.pts?"+"+currentListItem.pts+" pts":"free"))
            : optPtsLabel(opt, modelCount);
          const clickAction = isSharedUsed ? "" :
            isList ? `openListPicker('${esc(iid)}',${slotIdx},'${slot.id}','${opt.list}')` :
            `setSlotOption('${esc(iid)}',${slotIdx},'${slot.id}','${opt.id}')`;
          const listChevron = isList ? ` <span style="font-size:12px;color:var(--text-muted);">▶</span>` : "";
          const legionBadge = opt.req && opt.req.legion ? ` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${opt.req.legion}</span>` : "";
          const optWA = weaponHoverAttrs(displayLabel);
          html += `<div class="slot-option${effectiveSelected?" selected":""}${isSharedUsed?" disabled":""}"
            onclick="${clickAction}" ${optWA}>
            <span>${displayLabel}${legionBadge}${listChevron}${isSharedUsed?` <span class="slot-option-note">— already selected</span>`:""}</span>
            <span class="slot-option-pts">${displayPts}</span>
          </div>`;
        });
      }
      html += `</div>`;
    });
    } // end exchangeable slots
    html += `</div>`; // end weapon options section
  }

  // Add-ons
  if (wg.addons && wg.addons.length) {
    html += `<hr class="mdiv"><div class="wg-section"><div class="wg-section-title">Additional Options</div>`;

    wg.addons.forEach(addon => {
      // Always-on entries (e.g. an innate discipline like the Esoterist's Anathemata
      // Discipline): shown active and locked, not toggleable, and excluded from the
      // discipline cap. Their grants are applied unconditionally in the grant-gather above.
      if (addon.always_on) {
        html += `<div class="addon-row active" style="cursor:default;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="addon-check on"></div>
            <span ${weaponHoverAttrs(addon.label)}>${addon.label} <span class="addon-reason">(always active)</span></span>
          </div>
          <span class="addon-pts">${addon.pts?`+${addon.pts} pts`:"—"}</span>
        </div>`;
        return;
      }
      const isActive = (cfg.addons||[]).includes(addon.id);

      // Standard addon (existing logic below)
      // Check availability
      let unavailable = false; let reason = "";
      if (addon.excludes_addon && addon.excludes_addon.some(id=>(cfg.addons||[]).includes(id))) {
        unavailable=true; reason="conflicts with "+addon.excludes_addon.map(id=>{const a=(wg.addons||[]).find(x=>x.id===id);return a?a.label:id;}).join(", ");
      }
      // Also disable if addon conflicts with included gear in active profile
      if (!unavailable && addon.excludes_addon) {
        const profIncluded = wg.included_slots||[];
        const conflict = addon.excludes_addon.find(id => profIncluded.some(s=>s.toLowerCase().replace(/[^a-z]/g,'_').includes(id.replace(/[^a-z]/g,'_'))));
        if (conflict) { unavailable=true; reason="incompatible with "+conflict.replace(/_/g,' '); }
      }
      if (addon.excludes_pair && cfg.pairExchange && addon.excludes_pair.includes(cfg.pairExchange)) {
        unavailable=true; reason="requires bolter";
      }
      if (addon.requires_slot_default) {
        const slotChoice=(cfg.slots||{})[addon.requires_slot_default];
        if(slotChoice){unavailable=true;reason="requires "+addon.requires_slot_default+" (not exchanged)";}
      }
      // Discipline cap: at most maxDisciplines active at once
      if (!unavailable && addon.discipline && !isActive) {
        const activeDisc = (wg.addons||[]).filter(a=>a.discipline && (cfg.addons||[]).includes(a.id)).length;
        const maxDisc = addon.maxDisciplines || 2;
        if (activeDisc >= maxDisc) { unavailable=true; reason=`max ${maxDisc} disciplines`; }
      }
      const cls = isActive?"active":unavailable?"unavailable":"available";
      const addonBadge = addon.req && addon.req.legion ? ` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${addon.req.legion}</span>` : "";
      html += `<div class="addon-row ${cls}" onclick="${!unavailable?`toggleAddon('${esc(iid)}',${slotIdx},'${addon.id}')`:""}" >
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="addon-check${isActive?" on":""}"></div>
          <span ${weaponHoverAttrs(addon.label)}>${addon.label}${addonBadge}${unavailable?` <span class="addon-reason">(${reason})</span>`:""}</span>
        </div>
        <span class="addon-pts">+${addon.pts} pts</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Per-model section (Champion + Chosen)
  if (wg.perModel) {
    // ── per5cap accounting (BUG-001): slot-agnostic, honours per5max, counts list-based picks ──
    const eachModel = (cb) => {
      cb('champion', wg.champion||{}, cfg.champion||{});
      (cfg.chosen||[]).forEach((mc, idx) => cb(String(idx), wg.perModel||{}, mc||{}));
    };
    const modelPer5capCount = (wgm, mc, capGroup) => {
      let n = 0;
      (wgm.slots||[]).forEach(s => {
        const chosen = (mc.slots||{})[s.id];
        if (!chosen) return;
        const direct = (s.options||[]).find(o => o.id === chosen);
        if (direct && direct.per5cap === capGroup) { n++; return; }
        const listOpts = (s.options||[]).filter(o => o.list && o.per5cap === capGroup);
        if (listOpts.some(lo => { const L = WARGEAR_LISTS[lo.list]; return L && L.items.some(it => it.id === chosen); })) n++;
      });
      (mc.addons||[]).forEach(aid => {
        const a = (wgm.addons||[]).find(x => x.id === aid);
        if (a && a.per5cap === capGroup) n++;
      });
      return n;
    };
    const countPer5capUsed = (capGroup, exceptKey) => {
      let total = 0;
      eachModel((key, wgm, mc) => { if (key !== exceptKey) total += modelPer5capCount(wgm, mc, capGroup); });
      return total;
    };
    const modelHasPer5cap = (key, capGroup) => {
      let has = false;
      eachModel((k, wgm, mc) => { if (k === key && modelPer5capCount(wgm, mc, capGroup) > 0) has = true; });
      return has;
    };
    // ── requires_slot check (BUG-004): option available only if the referenced option/list is chosen on this model ──
    const requiresSlotMet = (mc, mwg, reqId) => {
      for (const s of (mwg.slots||[])) {
        const chosen = (mc.slots||{})[s.id];
        if (!chosen) continue;
        if (chosen === reqId) return true;
        const reqOpt = (s.options||[]).find(o => o.id === reqId);
        if (reqOpt && reqOpt.list) {
          const L = WARGEAR_LISTS[reqOpt.list];
          if (L && L.items.some(it => it.id === chosen)) return true;
        }
      }
      return false;
    };

    const _uniformSquad = isUniform(u) && !upgraded;
    html += renderModelSection('champion', wg.champion, cfg.champion||{}, _uniformSquad ? modelLabel+' 1' : championLabel, false);
    // Models
    (cfg.chosen||[]).forEach((mc, idx) => {
      html += renderModelSection(String(idx), wg.perModel, mc, modelLabel+' '+(idx + (_uniformSquad?2:1)), false);
    });
    html += `</div>`;
  }

  // Sergeant button
  if (wg.sergeant) {
    const sc = cfg.sergeant || {};
    const sgtCostItems = [];
    if (sc.pairExchange) {
      const pair=(wg.sergeant.pairs||[]).find(x=>x.id===sc.pairExchange);
      if(pair) sgtCostItems.push(pair.label);
    }
    (wg.sergeant.slots||[]).forEach(slot=>{
      const chosen=(sc.slots||{})[slot.id];
      if(chosen){const opt=resolveOption(slot,chosen);if(opt)sgtCostItems.push(opt.label);}
    });
    (sc.addons||[]).forEach(id=>{
      const a=(wg.sergeant.addons||[]).find(x=>x.id===id);if(a)sgtCostItems.push(a.label);
    });
    const sgtDefaultEquip = (wg.sergeant&&wg.sergeant.included_slots||[]).join(', ') || "Standard equipment";
    const sgtSummary = sgtCostItems.length ? sgtCostItems.join(", ") : sgtDefaultEquip;
    html += `<hr class="mdiv"><div class="wg-section">
      <div class="wg-section-title">Sergeant</div>
      <div class="pair-option" style="background:#f0f4e8;border-color:#6a8a4a;" onclick="openSergeant('${esc(iid)}',${slotIdx})">
        <div class="pair-label">
          <span style="font-weight:600">Configure Sergeant</span>
          <span class="pair-sublabel">${sgtSummary}</span>
        </div>
        <span style="font-size:13px;color:var(--text-muted);">▶</span>
      </div>
    </div>`;
  }

  html += `<div class="mpt">Total: ${totalCost} pts</div>
    <button class="clrbtn" onclick="${(ST.modal&&ST.modal.mode==='inj_customise')?'clearInjected':'clearSlot'}('${esc(iid)}',${slotIdx})">Remove unit from slot</button>
  </div></div>`;
  return html;
}

// ── Card render ──────────────────────────────────────────────────────────────
function renderCard(det){
  const def=DD[det.did];const isPri=def.cat==="primary";const pts=detPts(det);
  const sirePrime=sireTroopsPrime();
  const reqBadge=def.req?(()=>{const parts=[];if(def.req.legion)parts.push(def.req.legion);if(def.req.allegiance)parts.push(def.req.allegiance);if(def.req.any_unit)parts.push(def.req.any_unit.map(id=>{const u=UNIT_LOOKUP[id];return u?u.name:id;}).join(" or "));return parts.length?`<span class="ibadge">Req: ${parts.join(" · ")}</span>`:""})():""
  const rnote=def.rnote?`<div class="rnote">⚠ ${def.rnote}</div>`:"";
  const kwSel=def.keyword_choice?(()=>{
    const btns=def.keyword_choice.map(kw=>
      `<button class="kwbtn${det.keyword===kw?" sel":""}" onclick="setDetKeyword('${esc(det.iid)}','${esc(kw)}')">${kw}</button>`).join("");
    const warn=det.keyword?"":`<span style="color:#f0b060;font-style:italic;"> — pick one to enable Retinue & Heavy Assault slots</span>`;
    return `<div class="rnote" style="color:var(--text);">Echelon keyword: ${btns}${warn}</div>`;
  })():"";
  const armyListNote=def.slotArmyList
    ?`<div class="rnote" style="color:var(--blue);">ℹ Unit data for restricted slots coming soon.</div>`:"";
  let uinfo="";
  if(def.slots.some(s=>s.r==="Command"||s.r==="HighCommand")){
    const hcf=def.slots.filter((s,i)=>s.r==="HighCommand"&&det.slots[i]).length;
    const cmdSlots=def.slots.filter((s,i)=>s.r==="Command"&&det.slots[i]&&det.pa[i]!=="special_assignment");
    const cmdUpgraded=cmdSlots.filter((s,i)=>{
      const idx=def.slots.indexOf(s);
      return det.slots[idx]&&det.slots[idx].commandUnlockUpgrade;
    }).length;
    const cmdNormal=cmdSlots.length-cmdUpgraded;
    // Sum actual aux unlocks from normal Command slots (respecting Officer of the Line)
    let cmdAuxTotal=0;
    cmdSlots.forEach((s,i)=>{
      const idx=def.slots.indexOf(s);
      const u=det.slots[idx]; if(!u)return;
      if(u.commandUnlockUpgrade) return; // already counted in apexAuxTotal
      const cfg=det.cfgs[idx]||{};
      const prof=(u.profiles&&u.profiles.length)?(u.profiles.find(pr=>pr.id===(cfg.profileId||u.profiles[0].id))||u.profiles[0]):null;
      const sr=(prof&&prof.specialRules)||u.specialRules||[];
      const ootl=sr.find(r=>r.startsWith("Officer of the Line ("));
      cmdAuxTotal+=ootl?parseInt(ootl.match(/\((\d+)\)/)?.[1]||"1"):1;
    });
    const apexAuxTotal=hcf+cmdUpgraded;
    const parts=[];
    if(apexAuxTotal>0) parts.push(apexAuxTotal+" Apex/Aux unlock"+(apexAuxTotal!==1?"s":"")+" from HC"+(cmdUpgraded>0?" + Delegatus":""));
    if(cmdAuxTotal>0) parts.push(cmdAuxTotal+" Aux unlock"+(cmdAuxTotal!==1?"s":"")+" from Command");
    const saLocked=def.slots.filter((s,i)=>s.r==="Command"&&det.slots[i]&&det.pa[i]==="special_assignment").length;
    if(saLocked>0) parts.push(saLocked+" Command slot"+(saLocked!==1?"s":"")+" locked (Special Assignment)");
    uinfo=`<div class="unlock-info">${parts.join(" · ")||"No unlocks yet"}</div>`;
  }
  // Build full slot list including injected slots
  const injectedSlots = getInjectedSlots(det);
  const allSlotDefs = [
    ...def.slots.map((s,i) => ({...s, _idx:i, _injected:false})),
    ...injectedSlots.map((s,j) => ({...s, _idx: def.slots.length + j, _injected:true, _injIdx:j})),
  ];
  const slotCells=allSlotDefs.map((s)=>{
    const i = s._idx;
    const u = s._injected ? null : det.slots[i];
    const cfg = s._injected ? {} : (det.cfgs[i]||{});
    const adv=PA.find(a=>a.id===det.pa[i]);
    const rn=s.r.replace(/([A-Z])/g," $1").trim();
    const isMissing=u&&u._missing;
    // Effective prime: natively prime, OR a Troops slot made prime by a Sire rule.
    const sireP = isPri && !s._injected && !!sirePrime && sirePrime.iid===det.iid && sirePrime.set.has(i);
    const pe = s.p || sireP;
    // Injected slots: show with a tinted indicator and note, not clickable if armyList restricted
    if (s._injected) {
      const ii = s._injIdx; // index into injectedUnits
      const iu = (det.injectedUnits||[])[ii] || null;
      const ic = (det.injectedCfgs||[])[ii] || {};
      const noteStr = s.coopt ? 'Co-opt → AL' : (s.logisticae ? 'Logisticae' : (s.logistical ? 'Logistical' : (s.note ? s.note.split('(')[0].trim() : 'Injected')));
      const borderCol = s.coopt ? '#8a4a8a' : (s.logisticae ? '#3a6a8a' : (s.logistical ? '#4a8a4a' : '#1a3a5c'));
      const isMissingInj = iu && iu._missing;
      const innerInj = `<img src="data:image/png;base64,${ICONS[s.r]||ICONS.Troops}" alt="${rn}" />`;
      const factionNote = (s.coopt && iu) ? `<div style="font-size:8px;color:#c080c0;text-align:center;width:76px;">Faction → Alpha Legion</div>` : "";
      const nameInj = iu
        ? `<div class="slot-name">${iu.name}</div><div class="slot-pts">${isMissingInj?"?":cp(iu,ic)+" pts"}</div>`
        : "";
      const cfnInj = iu
        ? `openInjectedCustom('${esc(det.iid)}',${ii})`
        : `openInjectedPick('${esc(det.iid)}',${ii},'${s.r}','${s.armyList||""}','${(s.note||"").replace(/'/g,"\\'")}',${s.coopt?"true":"false"})`;
      return `<div class="scol"><div class="sout">
        <div class="sc${iu?" filled":""}" style="border-color:${borderCol};" onclick="${cfnInj}" title="${rn} · ${noteStr}">
          ${innerInj}
        </div></div>
        ${nameInj}
        <div class="rlbl" style="color:var(--text-muted);font-style:italic;">${rn}</div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;width:88px;margin-top:1px;">${noteStr}</div>
        ${factionNote}
      </div>`;
    }
    const inner=`<img src="data:image/png;base64,${ICONS[s.r]||ICONS.Troops}" alt="${rn}" />`;
    const nameBlock=u
      ?`<div class="slot-name">${u.name}</div><div class="slot-pts">${isMissing?"?":cp(u,cfg)+" pts"}</div>`
      :"";
    const logRole2 = adv&&(adv.id==="logistical"||adv.id==="rewards_of_treachery"||adv.id==="logisticae") ? (((det.paExtra||{})[i]||{}).logisticalRole||null) : null;
    const pchipLabel = adv ? (adv.label+(logRole2?" ("+logRole2.replace(/([A-Z])/g," $1").trim()+")":"")) : "+ Prime Adv.";
    const pc=pe?`<div class="pchip-w"><button class="pchip${det.pa[i]?"":" unset"}" onclick="event.stopPropagation();openPA('${esc(det.iid)}',${i})">${pchipLabel}</button></div>`:"";
    const cfn=u?`openCustom('${esc(det.iid)}',${i})`:`openPick('${esc(det.iid)}',${i})`;
    return `<div class="scol"><div class="sout">${pe?spk():""}<div class="sc${u?" filled":""}${isMissing?" missing":""}" onclick="${cfn}" title="${rn}${pe?(sireP?" · Prime (Sire)":" · Prime"):""}">${inner}</div></div>${pc}${nameBlock}<div class="rlbl">${rn}</div></div>`;
  });
  // Primary detachment: group cells into one row per battlefield role for clarity.
  let slotsH;
  if (isPri) {
    const groups=[];
    allSlotDefs.forEach((s,idx)=>{
      const last=groups[groups.length-1];
      if(last && last.r===s.r) last.cells.push(slotCells[idx]);
      else groups.push({r:s.r, cells:[slotCells[idx]]});
    });
    slotsH = groups.map(g=>`<div class="det-slot-row">${g.cells.join("")}</div>`).join("");
  } else {
    slotsH = slotCells.join("");
  }
  return `<div class="dcard${isPri?" primary":""}">
    <div class="chdr">
      <div class="chdr-l">
        <div class="crow"><span class="badge ${BC[def.cat]||"bx"}">${BL[def.cat]||def.cat}</span><span class="ctitle">${def.name}</span>${reqBadge}</div>
        ${rnote}${kwSel}${armyListNote||""}${uinfo}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:14px;color:var(--text-muted)">${pts} pts</span>
        ${!isPri?`<button class="rmbtn" onclick="remDet('${esc(det.iid)}')">✕</button>`:""}
      </div>
    </div>
    <div class="slots${isPri?" slots-grouped":""}">${slotsH}</div>
  </div>`;
}

// Detachment gating tier: legion-specific, unit-in-army-gated, or ungated.
function detTier(def){
  if(def.req && def.req.legion) return 'legion';
  if(def.req && def.req.any_unit) return 'unit';
  return 'ungated';
}
function pbtn(did,cat){
  const def=DD[did];const reason=disReason(def,cat);const dis=!!reason;
  const tier=detTier(def);
  const reqStr=def.req?(()=>{const rp=[];if(def.req.legion)rp.push(def.req.legion);if(def.req.allegiance)rp.push(def.req.allegiance);if(def.req.any_unit)rp.push(def.req.any_unit.map(id=>{const u=UNIT_LOOKUP[id];return u?u.name:id;}).join(" or "));return rp.length?`<br><em style="color:#a0c0e0">Req: ${rp.join(" · ")}</em>`:"";})():"";
  const tip=`<div class="tip"><strong>${def.name}</strong>${reason?"":reqStr}<br>${stip(def.slots)}${reason?`<br><em style="color:#f09090">${reason}</em>`:""}</div>`;
  const pill=(tier==='legion'&&def.req&&def.req.legion)?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${def.req.legion}</span>`:"";
  const tierCls=tier==='legion'?" pb-legion":tier==='unit'?" pb-unit":"";
  return `<button class="pb${cat==="apex"?" apex":cat==="warlord"?" wlord":""}${tierCls}" onclick="addDet('${did}')" ${dis?"disabled":""}>${def.name}${pill}${tip}</button>`;
}

function renderPool(){
  const allApex=["combat_retinue","officer_cadre","army_vanguard","linebreaker_echelon","hammer_of_olympia"];
  const allAux=["armoured_fist","tactical_support","armoured_support","heavy_support","combat_pioneer","shock_assault","first_strike","apothecarion_detachment","techmarine_covenant","daemonic_manifestation","dreadnought_talon","recon_demi_company","maelstrom_sentry_battery","storm_battery","veteran_cadre","ironfire_cohort","headhunter_leviathal","planetfall_speartip","primus_demi_company","supremacy_cadre"];
  function reqMet(d){
    if(!d.req)return true;
    if(d.req.legion&&d.req.legion!==ST.legion)return false;
    if(d.req.allegiance&&d.req.allegiance!==ST.allegiance)return false;
    if(d.req.any_unit){
      // Requires one of the listed unit IDs to be present in any detachment
      const hasUnit=d.req.any_unit.some(uid=>ST.dets.some(det=>det.slots.some(u=>u&&(u.id===uid||u.name===uid))));
      if(!hasUnit)return false;
    }
    return true;
  }
  const ai=allApex.filter(id=>{
    const d=DD[id];
    if(!d.req)return true;
    if(d.req.allegiance&&d.req.allegiance!==ST.allegiance)return false;
    if(d.req.legion&&d.req.legion!==ST.legion)return false;
    return true;
  });
  const xi=allAux.filter(id=>{
    const d=DD[id];
    if(!d.req)return true;
    if(d.req.allegiance&&d.req.allegiance!==ST.allegiance)return false;
    if(d.req.legion&&d.req.legion!==ST.legion)return false;
    return true;
  });
  const wE=!!ST.dets.find(d=>DD[d.did].cat==="warlord");
  const lE=!!ST.dets.find(d=>DD[d.did].cat==="lordsofwar");
  // Order each pool: legion-specific first, then ungated, then unit-in-army gated.
  const _tierOrd={legion:0,ungated:1,unit:2};
  const _sortByTier=arr=>arr.sort((a,b)=>_tierOrd[detTier(DD[a])]-_tierOrd[detTier(DD[b])]);
  _sortByTier(ai); _sortByTier(xi);
  return `<div class="pool-area">
    <div><div class="sec-title">Add Apex Detachment</div><div class="pool">${ai.map(id=>pbtn(id,"apex")).join("")}</div></div>
    <div><div class="sec-title">Add Auxiliary Detachment</div><div class="pool">${xi.map(id=>pbtn(id,"auxiliary")).join("")}</div></div>
    <div><div class="sec-title">Special Detachments</div><div class="pool">${!wE?pbtn("warlord_det","warlord"):""}${!lE?pbtn("lords_of_war","lordsofwar"):""}</div></div>
  </div>`;
}

// ── Modal dispatch ────────────────────────────────────────────────────────────
function renderModal(){
  if(!ST.modal)return"";
  const{mode,iid,i}=ST.modal;
  const det=ST.dets.find(d=>d.iid===iid);
  if(!det)return"";
  const def=DD[det.did];
  // Injected slot modes don't use sd/rn — guard against out-of-bounds index
  if(mode==="inj_pick"||mode==="inj_customise") {
    if(mode==="inj_pick"){
      const{ii,role,armyList,note,coopt}=ST.modal;
      const rn2=role.replace(/([A-Z])/g," $1").trim();
      // Army-list restricted slots show coming-soon message instead of unit list
      if(armyList){
        return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
          <button class="mc" onclick="closeModal()">✕</button>
          <div class="mt">${rn2} — Restricted</div>
          <div class="ms" style="color:var(--blue);">${note||'Unit data for this army list is coming soon.'}</div>
          <hr class="mdiv">
          <div style="text-align:center"><button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="closeModal()">↩ Back</button></div>
        </div></div>`;
      }
      // "Rewards of Treachery" co-opt slot: only faction-specific units from another Legion,
      // no [Legiones Astartes] wildcard, not Unique. Their Faction Trait becomes Alpha Legion.
      const us = coopt ? (SU[role]||[]).filter(unitCooptEligible) : (SU[role]||[]);
      const subMsg = coopt
        ? 'Co-opt: faction-specific unit from another Legion — its Faction Trait becomes Alpha Legion'
        : 'Injected slot';
      return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
        <button class="mc" onclick="closeModal()">✕</button>
        <div class="mt">Choose ${rn2}</div><div class="ms"${coopt?' style="color:#c080c0;"':''}>${subMsg}</div>
        ${us.length?us.map(u=>{
          const profileHint=u.profiles&&u.profiles.length>1?` · ${u.profiles.length} profiles`:'';
          const minSz=u.minSize||1;const maxSz=u.maxSize||1;
          const legNote=coopt&&u.req&&u.req.legion?'<span style="font-size:12px;color:#c080c0;font-style:italic;margin-left:6px;">'+u.req.legion+'</span>':'';
          const uniqueBlock=unitUniqueBlocked(u,iid,-1);
          const uNote=uniqueBlock?'<span style="font-size:12px;color:var(--red);font-style:italic;margin-left:6px;">— unique, already in army</span>':'';
          const injOnclick = uniqueBlock ? '' : "assignInjectedById('" + u.id + "')";
          const injStyle = uniqueBlock ? 'opacity:.4;cursor:not-allowed;' : '';
          const injCls = uniqueBlock ? ' disabled' : '';
          return '<div class="uo' + injCls + '" onclick="' + injOnclick + '" style="' + injStyle + '">' +
            '<span>' + u.name + legNote + uNote + '</span>' +
            '<span style="font-size:14px;color:var(--text-muted)">' + u.basePts + ' pts base' +
            (maxSz>minSz?' · '+minSz+'–'+maxSz+' models':'') + profileHint + '</span>' +
            '</div>';
        }).join(''):'<div style="font-size:15px;color:var(--text-muted);font-style:italic;padding:8px 0;">'+(coopt?'No eligible other-Legion units in the roster yet.':'No unit data available yet for this slot.')+'</div>'}
      </div></div>`;
    }
    if(mode==="inj_customise"){
      const{ii}=ST.modal;
      const u=(det.injectedUnits||[])[ii];
      if(!u)return'';
      const fakeDet={...det, slots:det.injectedUnits||[], cfgs:det.injectedCfgs||[]};
      return renderWargearModal(fakeDet, ii);
    }
    return"";
  }
  const sd=def.slots[i];const rn=sd.r.replace(/([A-Z])/g," $1").trim();

  if(mode==="prime"){
    const cur=det.pa[i]||"";const isSA=sd.r==="Command";
    const paExtra=det.paExtra||{};
    const logRole=(paExtra[i]||{}).logisticalRole||null;
    // Slot-adding advantages show a role picker before they resolve.
    const isSlotAdder = (cur==="logistical"||cur==="rewards_of_treachery"||cur==="logisticae");
    if(isSlotAdder&&!logRole){
      const adderLabel = (PA.find(a=>a.id===cur)||{}).label || "Bonus Slot";
      const eligibleRoles = cur==="logisticae"
        ? ["Transport","HeavyTransport"]
        : ["Retinue","Elites","WarEngine","Troops","Support",
        "HeavyAssault","HeavyTransport","Armour","Recon","FastAttack","Transport"];
      return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
        <button class="mc" onclick="closeModal()">✕</button>
        <div class="mt">${adderLabel}</div>
        <div class="ms">Choose the slot type to add</div>
        ${eligibleRoles.map(r=>{
          const rn2=r.replace(/([A-Z])/g," $1").trim();
          return `<div class="po" onclick="setLogisticalRole('${esc(iid)}',${i},'${r}')">
            <div class="pon">${rn2}</div></div>`;
        }).join("")}
        <button class="clrbtn" style="margin-top:.5rem" onclick="setPA('${esc(iid)}',${i},'')">↩ Back</button>
      </div></div>`;
    }
    return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <div class="mt">Prime Advantage</div><div class="ms">${rn} slot</div>
      ${PA.filter(a=>(det.slots[i]||a.id==="special_assignment") && (a.id!=="special_assignment"||isSA) && (a.id!=="rewards_of_treachery"||isSA) && (a.id!=="logisticae"||isSA) && (!a.slotRole || (def.slots[i]&&def.slots[i].r===a.slotRole)) && !paOncePerDetTaken(a, det, i) && paAvailable(a, det.slots[i])).map(a=>{
        const isLog=a.id==="logistical"||a.id==="rewards_of_treachery"||a.id==="logisticae";
        const roleSuffix=isLog&&logRole?" ("+logRole.replace(/([A-Z])/g," $1").trim()+")":"";
        const reqBadge=a.req||a.slotRole?(()=>{const parts=[];if(a.req&&a.req.legion)parts.push(a.req.legion);if(a.req&&a.req.allegiance)parts.push(a.req.allegiance);if(a.req&&a.req.infantryOnly)parts.push("Infantry only");if(a.slotRole)parts.push(a.slotRole+" slot");return parts.length?` <span class="ibadge">Req: ${parts.join(" · ")}</span>`:"";})():"";
        return `<div class="po${cur===a.id?" sel":""}" onclick="setPA('${esc(iid)}',${i},'${a.id}')">
          <div class="pon">${a.label}${roleSuffix}${reqBadge}</div>
          <div class="pod">${a.desc}</div>
        </div>`;
      }).join("")}
      ${cur?`<button class="clrbtn" style="margin-top:.5rem" onclick="setPA('${esc(iid)}',${i},'')">Clear</button>`:""}
    </div></div>`;
  }

  if(mode==="pick"){
    let us=[...(SU[sd.r]||[])];
    // Special Assignment: a Command slot carrying this prime may also be filled by a High Command unit.
    if(sd.r==="Command" && det.pa[i]==="special_assignment") us=[...us, ...(SU.HighCommand||[])];
    if(def.restr&&def.restr[sd.r])us=us.filter(u=>def.restr[sd.r].includes(u.name));
    // Keyword-restricted detachment (e.g. Linebreaker Echelon): the chosen word
    // filters which units these roles may take, by unit-name substring.
    const kwActive = def.keyword_roles && def.keyword_roles.includes(sd.r);
    let kwNote="";
    if(kwActive){
      if(!det.keyword){
        us=[];
        kwNote=`<div class="wt">Select an Echelon keyword on the detachment first.</div>`;
      } else {
        us=us.filter(u=>u.name.toLowerCase().includes(det.keyword.toLowerCase()));
        kwNote=`<div class="wt">⚠ ${det.keyword} units only (name must include "${det.keyword}").</div>`;
      }
    }
    const beforeLegion=us.length;
    us=us.filter(u=>unitLegionOk(u));
    const rn2=def.restr&&def.restr[sd.r]?`<div class="wt">⚠ Restricted to: ${def.restr[sd.r].join(", ")}</div>`:"";
    const legionNote = (us.length===0 && beforeLegion>0)
      ? `<div class="wt">No ${ST.legion} units available for this slot — try changing the Legion in the header.</div>` : "";
    const emptyNote = (us.length===0)
      ? `<div style="padding:14px;color:var(--text-muted);font-style:italic;">No eligible units.</div>` : "";
    return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <div class="mt">Choose ${rn}</div><div class="ms">${sd.p?"⚡ Prime slot":"Standard slot"}</div>
      ${rn2}${kwNote||""}${legionNote}${emptyNote}
      ${us.map(u=>{
        const profileHint = u.profiles && u.profiles.length > 1
          ? ` · ${u.profiles.length} profiles` : '';
        const minSz = u.minSize||1; const maxSz = u.maxSize||1;
        const uniqueBlock = unitUniqueBlocked(u, iid, i);
        const allegianceBlock = unitAllegianceBlocked(u);
        const blocked = uniqueBlock || allegianceBlock;
        const uniqueNote = uniqueBlock
          ? `<span style="font-size:12px;color:var(--red);font-style:italic;margin-left:6px;">— unique, already in army</span>`
          : (allegianceBlock
            ? `<span style="font-size:12px;color:var(--red);font-style:italic;margin-left:6px;">— requires ${u.req.allegiance} allegiance</span>` : '');
        let reqParts = [];
        if (u.req && u.req.legion) reqParts.push(u.req.legion);
        else if (u.req && u.req.legion_any) reqParts.push(u.req.legion_any.join(' / '));
        if (u.req && u.req.allegiance) reqParts.push(u.req.allegiance);
        const reqTxt = reqParts.join(' · ');
        const badgeStyle = allegianceBlock
          ? 'font-size:10px;padding:1px 5px;background:var(--red);color:#fff;border-color:var(--red);'
          : 'font-size:10px;padding:1px 5px;';
        const legBadge = reqTxt ? ` <span class="ibadge" style="${badgeStyle}">Req: ${reqTxt}</span>` : '';
        const onclickStr = blocked ? '' : 'assignById(' + "'" + u.id + "'" + ')';
        const styleStr2 = blocked ? 'opacity:.4;cursor:not-allowed;' : '';
        const disClass = blocked ? ' disabled' : '';
        return '<div class="uo' + disClass + '" onclick="' + onclickStr + '" style="' + styleStr2 + '">' +
               '<span><button class="eye-btn" onclick="event.stopPropagation()" data-unit="' + u.id + '">👁</button>' +
               u.name + legBadge + (uniqueNote||'') + '</span>' +
               '<span style="font-size:14px;color:var(--text-muted)">' + u.basePts + ' pts base' +
               (maxSz>minSz?' · '+minSz+'–'+maxSz+' models':'') + profileHint + '</span>' +
               '</div>';
      }).join("")}
    </div></div>`;
  }

  if(mode==="customise") return renderWargearModal(det, i);



  if(mode==="sergeant"){
    const det2=modalDet(ST.dets.find(d=>d.iid===iid));
    if(!det2)return"";
    const u=det2.slots[i]; if(!u||!u.wargear||!u.wargear.sergeant)return"";
    const cfg=det2.cfgs[i]||{};
    const sc=cfg.sergeant||{};
    const sgtwg=u.wargear.sergeant;
    const modelCount=cfg.size||u.minSize;
    const sgtTypeStr=sgtwg.type?`${sgtwg.type}${sgtwg.subtypes&&sgtwg.subtypes.length?' ('+sgtwg.subtypes.join(', ')+')':''}` :'';
    let html=`<div class="ov" onclick="backToUnit('${esc(iid)}',${i})">
      <div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="backToUnit('${esc(iid)}',${i})">✕</button>
      <div class="mt">Sergeant</div>
      <div class="ms">${sgtTypeStr?`<span style="color:var(--gold-dark);font-style:normal;">${sgtTypeStr}</span> · `:''}Single model</div>`;
    // No separate summary — included items shown inline in Weapon Options
    // Pair exchanges now shown inline on slot options
    // Weapon options
    const sgtHasShields = (cfg.slots||{})['pistol_all'] === 'combat_shield_all';
    const sgtHasWeaponSection=(sgtwg.included_slots&&sgtwg.included_slots.length)||(sgtwg.slots&&sgtwg.slots.length);
    if(sgtHasWeaponSection){
      html+=`<hr class="mdiv"><div class="wg-section"><div class="wg-section-title">Weapon Options</div>`;
      (sgtwg.included_slots||[]).forEach(item=>{
        const sgtWA = weaponHoverAttrs(item);
        html+=`<div class="slot-row"><div class="slot-current" style="background:#f5f0e4;border:.5px solid #d4c88a;">
          <span class="slot-current-name" style="color:var(--text-muted);font-style:italic;" ${sgtWA}>${item}</span>
          <span style="font-size:12px;color:var(--text-muted);">standard</span>
        </div></div>`;
      });
      if(sgtwg.slots&&sgtwg.slots.length){
      sgtwg.slots.forEach(slot=>{
        // Hide pistol slot when whole unit has combat shields
        if(slot.id==='sgt_pistol' && sgtHasShields) return;
        const locked=slotLocked(sgtwg,sc,slot.id);
        const current=slotLabel(sgtwg,sc,slot);
        html+=`<div class="slot-row">
          <div class="slot-current">
            <span class="slot-current-name">${slot.label}${locked?` <span style="font-size:12px;color:var(--text-muted);font-weight:normal;">(replaced by ${current.name})</span>`:''}</span>
            ${!locked&&!current.isDefault?`<button class="slot-reset" onclick="setSgtSlotOption('${esc(iid)}',${i},'${slot.id}',null)">↩ restore</button>`:''}
          </div>`;
        // Pair exchanges for this slot
        const unitHasShields2 = (cfg.slots||{})['pistol_all'] === 'combat_shield_all';
        (sgtwg.pairs||[]).forEach(pair=>{
          if(!(pair.replaces||[]).includes(slot.id))return;
          const isSel=sc.pairExchange===pair.id;
          const sublabel=pair.id==='sgt_lc'?'Replaces chainsword & '+(unitHasShields2?'combat shield':'bolt pistol'):pair.sublabel;
          const pairWA=weaponHoverAttrs(pair.label);
          html+=`<div class="slot-option${isSel?' selected':''}" onclick="setSgtPairExchange('${esc(iid)}',${i},'${pair.id}')" ${pairWA}>
            <span>${pair.label} <span style="font-size:12px;color:var(--text-muted);">(pair exchange)</span></span>
            <span class="slot-option-pts">+${pair.pts} pts</span>
          </div>`;
        });
        if(!locked){
          const allSgtSlotOpts = [...slot.options, ...getFactionOptions(slot)];
          allSgtSlotOpts.forEach(opt=>{
            if(!optionVisible(opt,u))return;
            const isSel=(sc.slots||{})[slot.id]===opt.id;
            const isSharedUsed=opt.shared&&sharedOptionUsed(sgtwg,sc,opt.id,slot.id);
            const isList=!!opt.list;
            const currentChoice=(sc.slots||{})[slot.id];
            const currentListItem=isList&&currentChoice?findListItem(currentChoice):null;
            const listIsActive=isList&&currentListItem&&
              opt.list&&(WARGEAR_LISTS[opt.list]||{items:[]}).items.some(ii=>ii.id===currentChoice);
            const effSel=isSel||listIsActive;
            const dispLabel=listIsActive?currentListItem.label:opt.label;
            const dispPts=listIsActive?(currentListItem.pts?'+'+currentListItem.pts+' pts':'free'):optPtsLabel(opt,1);
            const clickAction=isSharedUsed?'':isList
              ?`openPerModelListPicker('${esc(iid)}',${i},'champion','${slot.id}','${opt.list}')`
              :`setPerModelSlot('${esc(iid)}',${i},'champion','${slot.id}','${opt.id}')`;
            const listChevron=isList?` <span style="font-size:12px;color:var(--text-muted);">▶</span>`:'';
            const legBadge=opt.req&&opt.req.legion?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${opt.req.legion}</span>`:'';
            html+=`<div class="slot-option${effSel?' selected':''}${isSharedUsed?' disabled':''}" onclick="${clickAction}">
              <span>${dispLabel}${legBadge}${listChevron}${isSharedUsed?` <span class="slot-option-note">— already selected</span>`:''}</span>
              <span class="slot-option-pts">${dispPts}</span>
            </div>`;
          });
        }
        html+=`</div>`;
      });
      } // end sgt exchangeable slots
      html+=`</div>`; // end sgt weapon options
    }
    // Addons
    if(sgtwg.addons&&sgtwg.addons.length){
      html+=`<hr class="mdiv"><div class="wg-section"><div class="wg-section-title">Additional Options</div>`;
      sgtwg.addons.forEach(addon=>{
        const isActive=(sc.addons||[]).includes(addon.id);
        let unavail=false,reason='';
        if(addon.excludes_addon&&addon.excludes_addon.some(id=>(sc.addons||[]).includes(id))){
          unavail=true;reason='conflicts with '+addon.excludes_addon.map(id=>{const a=(sgtwg.addons||[]).find(x=>x.id===id);return a?a.label:id;}).join(', ');
        }
        if(addon.excludes_pair&&sc.pairExchange&&addon.excludes_pair.includes(sc.pairExchange)){
          unavail=true;reason='requires bolter';
        }
        if(addon.requires_slot_default){
          if((sc.slots||{})[addon.requires_slot_default]){unavail=true;reason='requires '+addon.requires_slot_default+' (not exchanged)';}
        }
        const cls=isActive?'active':unavail?'unavailable':'available';
        html+=`<div class="addon-row ${cls}" onclick="${!unavail?`toggleSgtAddon('${esc(iid)}',${i},'${addon.id}')`:''}" >
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="addon-check${isActive?' on':''}"></div>
            <span ${weaponHoverAttrs(addon.label)}>${addon.label}${unavail?` <span class="addon-reason">(${reason})</span>`:''}</span>
          </div>
          <span class="addon-pts">+${addon.pts} pts</span>
        </div>`;
      });
      html+=`</div>`;
    }
    html+=`<hr class="mdiv"><div style="text-align:center">
      <button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="backToUnit('${esc(iid)}',${i});">↩ Back to unit</button>
    </div></div></div>`;
    return html;
  }

  if(mode==="pm_addon_list_pick"){
    const{modelKey,addonId,listKey}=ST.modal;
    const det2=modalDet(ST.dets.find(d=>d.iid===iid));
    const u2=det2?det2.slots[i]:null;
    const wg2=u2?activeWargear(u2,det2.cfgs[i]||{}):{};
    const cfg2=det2?(det2.cfgs[i]||{}):{};
    const mc2=modelKey==='champion'?(cfg2.champion||{}):(cfg2.chosen||[])[parseInt(modelKey)]||{};
    const mwg2=modelKey==='champion'?(wg2.champion||{}):(wg2.perModel||{});
    const addon2=(mwg2.addons||[]).find(a=>a.id===addonId);
    if(!addon2)return'';
    const items=addon2.listFixed||((WARGEAR_LISTS[listKey]||{}).items||[]).filter(item=>optionVisible(item,u2||{}));
    const currentChoice=(mc2.addonListChoices||{})[addonId];
    return `<div class="ov" onclick="backToUnit('${esc(iid)}',${i})">
      <div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="backToUnit('${esc(iid)}',${i})">✕</button>
      <div class="mt">${addon2.label}</div>
      <div class="ms">Select weapon for this model</div>
      ${items.map(item=>{
        const isChosen=currentChoice===item.id;
        const legBadge=item.req&&item.req.legion?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${item.req.legion}</span>`:'';
        const ptsLabel=item.pts?'+'+item.pts+' pts':'free';
        const pmAlWA = weaponHoverAttrs(item.label);
        return `<div class="slot-option${isChosen?' selected':''}" onclick="setPerModelAddonListChoice('${esc(iid)}',${i},'${modelKey}','${addonId}','${item.id}');" ${pmAlWA}>
          <span>${item.label}${legBadge}</span>
          <span class="slot-option-pts">${ptsLabel}</span>
        </div>`;
      }).join('')}
      <hr class="mdiv"><div style="text-align:center">
        <button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="backToUnit('${esc(iid)}',${i});">↩ Back</button>
      </div></div></div>`;
  }

  if(mode==="permodel_list_pick"){
    const{modelKey,slotId,listKey}=ST.modal;
    const list=WARGEAR_LISTS[listKey]; if(!list)return'';
    const det2=modalDet(ST.dets.find(d=>d.iid===iid));
    const u2=det2?det2.slots[i]:null;
    const cfg2=det2?(det2.cfgs[i]||{}):{};
    const mc2=modelKey==='champion'?(cfg2.champion||{}):(cfg2.chosen||[])[parseInt(modelKey)]||{};
    const items=list.items.filter(item=>optionVisible(item,u2||{}));
    const currentChoice=(mc2.slots||{})[slotId];
    return `<div class="ov" onclick="backToUnit('${esc(iid)}',${i})">
      <div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="backToUnit('${esc(iid)}',${i})">✕</button>
      <div class="mt">${list.label}</div>
      <div class="ms">Select a weapon for this model</div>
      ${items.map(item=>{
        const isChosen=currentChoice===item.id;
        const legBadge=item.req&&item.req.legion?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${item.req.legion}</span>`:'';
        const ptsLabel=item.pts?'+'+item.pts+' pts':'free';
        const pmLiWA = weaponHoverAttrs(item.label);
        const iidb64 = btoa(iid);
        return `<div class="slot-option${isChosen?' selected':''}" ${pmLiWA}
          onclick="handlePmSlot(atob('${iidb64}'),${i},'${modelKey}','${slotId}','${item.id}')">
          <span>${item.label}${legBadge}</span>
          <span class="slot-option-pts">${ptsLabel}</span>
        </div>`;
      }).join('')}
      <hr class="mdiv"><div style="text-align:center">
        <button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="backToUnit('${esc(iid)}',${i});">↩ Back</button>
      </div></div></div>`;
  }

  if(mode==="sgt_list_pick"){
    const{slotId,listKey}=ST.modal;
    const list=WARGEAR_LISTS[listKey]; if(!list)return'';
    const det2=modalDet(ST.dets.find(d=>d.iid===iid));
    const u2=det2?det2.slots[i]:null;
    const sc2=det2?(det2.cfgs[i]||{}).sergeant||{}:{};
    const items=list.items.filter(item=>optionVisible(item,u2||{}));
    const currentChoice=(sc2.slots||{})[slotId];
    return `<div class="ov" onclick="ST.modal={mode:'sergeant',iid:'${esc(iid)}',i:${i}};render()">
      <div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="ST.modal={mode:'sergeant',iid:'${esc(iid)}',i:${i}};render()">✕</button>
      <div class="mt">${list.label}</div>
      <div class="ms">Select one item — replaces the current weapon in this slot</div>
      ${items.map(item=>{
        const isChosen=currentChoice===item.id;
        const legBadge=item.req&&item.req.legion?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${item.req.legion}</span>`:'';
        const ptsLabel=item.pts?'+'+item.pts+' pts':'free';
        const sgtWA2 = weaponHoverAttrs(item.label);
        return `<div class="slot-option${isChosen?' selected':''}" onclick="setSgtSlotOption('${esc(iid)}',${i},'${slotId}','${item.id}');ST.modal={mode:'sergeant',iid:'${esc(iid)}',i:${i}};render();" ${sgtWA2}>
          <span>${item.label}${legBadge}</span>
          <span class="slot-option-pts">${ptsLabel}</span>
        </div>`;
      }).join('')}
      <hr class="mdiv"><div style="text-align:center">
        <button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="ST.modal={mode:'sergeant',iid:'${esc(iid)}',i:${i}};render();">↩ Back</button>
      </div></div></div>`;
  }

    if(mode==="list_pick"){
    const{slotId,listKey}=ST.modal;
    const list=WARGEAR_LISTS[listKey];
    if(!list)return"";
    // Filter by legion requirement
    const det2=modalDet(ST.dets.find(d=>d.iid===iid));
    const u2=det2?det2.slots[i]:null;
    const cfg2=det2?(det2.cfgs[i]||{}):{};
    const modelCount2=cfg2.size||(u2?u2.minSize:1);
    const items=list.items.filter(item=>optionVisible(item, u2||{}));
    const currentChoice=(cfg2.slots||{})[slotId];
    return `<div class="ov" onclick="closeModal()"><div class="mod" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <div class="mt">${list.label}</div>
      <div class="ms">Select one item — replaces the current weapon in this slot</div>
      ${items.map(item=>{
        const isChosen=currentChoice===item.id;
        const legBadge=item.req&&item.req.legion?` <span class="ibadge" style="font-size:10px;padding:1px 5px;">Req: ${item.req.legion}</span>`:"";
        const ptsLabel=item.ptsPerModel?`+${item.pts} pts/model (${item.pts*modelCount2} total)`:(item.pts?"+"+item.pts+" pts":"free");
        return `<div class="slot-option${isChosen?" selected":""}" onclick="setSlotOption('${esc(iid)}',${i},'${slotId}','${item.id}');backToUnit('${esc(iid)}',${i});" ${weaponHoverAttrs(item.label)}>
          <span>${item.label}${legBadge}</span>
          <span class="slot-option-pts">${ptsLabel}</span>
        </div>`;
      }).join("")}
      <hr class="mdiv">
      <div style="text-align:center">
        <button class="clrbtn" style="width:auto;padding:5px 20px;" onclick="backToUnit('${esc(iid)}',${i});">↩ Back</button>
      </div>
    </div></div>`;
  }

  return"";
}

// Resolve a selection key (slot index, or 'inj<j>') to its unit + cfg + context.
function playResolve(iid, key){
  const det = ST.dets.find(d=>d.iid===iid); if(!det) return null;
  const def = DD[det.did];
  if (String(key).startsWith('inj')){
    const j = parseInt(String(key).slice(3));
    const u = (det.injectedUnits||[])[j]; if(!u) return null;
    const inj = getInjectedSlots(det)[j];
    return {det, def, u, cfg:(det.injectedCfgs||[])[j]||{}, role:(inj&&inj.r)||'Troops', pa:null};
  }
  const i = parseInt(key);
  const u = det.slots[i]; if(!u) return null;
  return {det, def, u, cfg:det.cfgs[i]||{}, role:(def.slots[i]||{}).r||'', pa:det.pa[i]};
}

// All placed (non-missing) units across the army, with context.
function playCollectUnits(){
  const out=[];
  ST.dets.forEach(det=>{
    const def=DD[det.did];
    (def.slots||[]).forEach((s,i)=>{ const u=det.slots[i]; if(u&&!u._missing)
      out.push({iid:det.iid, key:String(i), u, cfg:det.cfgs[i]||{}, role:s.r, pa:det.pa[i]}); });
    (det.injectedUnits||[]).forEach((iu,j)=>{ if(iu&&!iu._missing){
      const inj=getInjectedSlots(det)[j];
      out.push({iid:det.iid, key:'inj'+j, u:iu, cfg:(det.injectedCfgs||[])[j]||{}, role:(inj&&inj.r)||'Troops', pa:null}); }});
  });
  return out;
}

function roleDisplay(r){ return String(r||'Unit').replace(/([A-Z])/g,' $1').trim(); }

// Resolve a special-rule / equipment name to its plain text (mirrors ruleTipHtml resolution).
function playRuleText(name){
  const resolve = nm => { const e=RULES[nm]||EQUIPMENT[nm];
    return (e&&e.text!=null&&String(e.text).trim()&&String(e.text).trim()!=='...')?e.text:null; };
  let text = resolve(name);
  if (text===null){ const m=name.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if(m){ const b=resolve(m[1]); if(b!==null) text=String(b).replace(/\{X\}/g,m[2]); } }
  return text; // may be null
}

// Weapon/gear labels carried by ONE model (block + that model's cfg). Excludes unit-wide included gear.
function _modelGearLabels(blk, mc){
  const ls=[]; const add=l=>{ if(l) ls.push(l); };
  const stripHint = s => String(s||'').replace(/\s*\([^)]*\)\s*$/,'').trim();  // drop UI hints like "(same for all)"
  if(blk){
    // A swap slot's default label names a weapon that ALSO appears in included_slots
    // (the slot is the editable handle for that included weapon). Emit it from the slot
    // only, so a swap (e.g. Bolter → Disintegrator Rifle) replaces rather than duplicates it.
    const slotDefaults = new Set((blk.slots||[]).map(s=>stripHint(s.label)));
    (blk.included_slots||[]).forEach(it=>{ const lbl=resolveGearLabel(it); if(!slotDefaults.has(stripHint(lbl))) add(lbl); });
    const pair = mc.pairExchange ? (blk.pairs||[]).find(x=>x.id===mc.pairExchange) : null;
    const replaced = pair ? new Set(pair.replaces||[]) : new Set();
    (blk.slots||[]).forEach(slot=>{
      if(replaced.has(slot.id)) return;  // slot replaced by an active pair exchange (e.g. lightning claws)
      if(typeof slotConsumedBy==='function' && slotConsumedBy(blk, mc, slot.id)) return; // consumed by a two-handed weapon
      const chosen=(mc.slots||{})[slot.id];
      if(chosen){ const opt=resolveOption(slot,chosen); if(opt){ if(opt.chips) opt.chips.forEach(add); else add(opt.label||chosen); } }
      else { if(slot.defaultChips) slot.defaultChips.forEach(add); else add(stripHint(slot.label)); }
    });
    if(pair){ if(pair.chips) pair.chips.forEach(add); else add(pair.label); }
    (mc.addons||[]).forEach(aid=>{ const a=(blk.addons||[]).find(x=>x.id===aid); if(!a) return;
      if(a.grants&&a.grants.weapons) a.grants.weapons.forEach(add);
      // An addon whose label is itself a weapon or piece of equipment (e.g. Grenade Harness, Augury Scanner)
      if(weaponKeyFromLabel(a.label) || (typeof EQUIPMENT!=='undefined' && EQUIPMENT[a.label])) add(a.label);
    });
  }
  return ls;
}

function pmPlural(label,n){
  if(n===1) return label;
  if(/(ii|s|x|Cavalry|Infantry|Justaerin)$/i.test(label)) return label;   // latin/mass/already-plural
  if(/[^aeiou]y$/.test(label)) return label.slice(0,-1)+'ies';
  if(/(ch|sh|z)$/i.test(label)) return label+'es';
  return label+'s';
}

// Equipped weapons for a unit+cfg with per-weapon counts, split ranged/melee.
function playLoadout(u, cfg){
  const wg = activeWargear(u, cfg);
  const counts={}, order=[];
  const bump=(lbl,n)=>{ if(!lbl||n<=0)return; if(!(lbl in counts)){counts[lbl]=0;order.push(lbl);} counts[lbl]+=n; };
  const size = wg.perModel ? (cfg.size||u.minSize||1) : 1;
  if(wg.perModel){
    (wg.included_slots||[]).forEach(it=>bump(resolveGearLabel(it), size));  // unit-wide gear on every model
    _modelGearLabels(wg.champion, cfg.champion||{}).forEach(l=>bump(l,1));
    const baseCount=size-1, chosen=cfg.chosen||[];
    for(let k=0;k<baseCount;k++) _modelGearLabels(wg.perModel, chosen[k]||{}).forEach(l=>bump(l,1));
  } else {
    _modelGearLabels(wg, cfg).forEach(l=>bump(l,1));  // wg.included_slots already covered here
  }
  const byKey={}, keyOrder=[];
  order.forEach(lbl=>{ const key=weaponKeyFromLabel(lbl); if(!key) return;
    if(!byKey[key]){ byKey[key]={w:WEAPONS[key],count:0}; keyOrder.push(key); }
    byKey[key].count+=counts[lbl]; });
  const ranged=[], melee=[];
  keyOrder.forEach(key=>{ const e=byKey[key], w=e.w;
    if(w.profiles&&w.profiles.length){
      if(w.profiles.some(p=>!p.melee)) ranged.push(e);
      if(w.profiles.some(p=>p.melee))  melee.push(e);
    } else if(w.melee) melee.push(e); else ranged.push(e); });
  return {ranged, melee, gearLabels:[...new Set(order)]};
}

// "Unit Composition & Wargear" — group models by loadout signature into summary lines.
function playComposition(u, cfg){
  const wg = activeWargear(u, cfg);
  const fmt = arr => { arr=[...new Set(arr.filter(Boolean))];
    if(!arr.length) return '—'; if(arr.length===1) return arr[0];
    return arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1]; };
  const incl = (wg.included_slots||[]).map(it=>resolveGearLabel(it));
  const groups=[];
  if(wg.perModel){
    const size=cfg.size||u.minSize||1;
    const upgraded=cfg.champUpgrade&&u.championUpgrade;
    const champLabel=upgraded?u.championUpgrade.label:(u.championLabel||'Champion');
    const baseLabel=u.baseModelLabel||'Model';
    const basePlural=u.baseModelPlural||null;
    const uniform=isUniform(u)&&!upgraded;
    const baseCount=size-1, chosen=cfg.chosen||[], sigMap={};
    const addToGroup=(weps,label)=>{
      const sig=label+'::'+[...new Set(weps)].sort().join('|');
      if(!sigMap[sig]){ sigMap[sig]={n:0,label,weps,plural:(label===baseLabel?basePlural:null)}; groups.push(sigMap[sig]); }
      sigMap[sig].n++;
    };
    if(uniform){
      addToGroup([...incl,..._modelGearLabels(wg.champion,cfg.champion||{})], baseLabel);
      for(let k=0;k<baseCount;k++) addToGroup([...incl,..._modelGearLabels(wg.perModel,chosen[k]||{})], baseLabel);
    } else {
      groups.push({n:1,label:champLabel,weps:[...incl,..._modelGearLabels(wg.champion,cfg.champion||{})]});
      for(let k=0;k<baseCount;k++) addToGroup([...incl,..._modelGearLabels(wg.perModel,chosen[k]||{})], baseLabel);
    }
  } else {
    groups.push({n:1,label:u.name,weps:[...incl,..._modelGearLabels(wg,cfg)]});
  }
  return `<div class="pm-section-h">UNIT COMPOSITION &amp; WARGEAR</div>`+
    groups.filter(g=>g.n>0).map(g=>
      `<div class="pm-comp">${g.n>1?'<b>'+g.n+'</b> '+(g.plural||pmPlural(g.label,g.n)):g.label} equipped with: ${fmt(g.weps)}.</div>`
    ).join('');
}

// Collect distinct unit types across the unit (profile + model blocks + granted + PA-granted).
function playCollectTypes(u, cfg, extra){
  const wg=activeWargear(u,cfg); const set=[]; const push=t=>{ if(t&&!set.includes(t)) set.push(t); };
  const prof=activeProfile(u,cfg);
  if(prof) [prof.type,...(prof.subtypes||[])].filter(Boolean).forEach(push);
  (u.modelTypes||[]).forEach(push);
  if(wg.perModel){
    ((wg.champion&&wg.champion.modelTypes)||[]).forEach(push);
    ((wg.perModel&&wg.perModel.modelTypes)||[]).forEach(push);
    if(typeof addonGrantedTypes==='function'){
      (addonGrantedTypes(wg.champion,cfg.champion||{})||[]).forEach(push);
      (cfg.chosen||[]).forEach(mc=>(addonGrantedTypes(wg.perModel,mc||{})||[]).forEach(push));
    }
  } else if(typeof addonGrantedTypes==='function'){ (addonGrantedTypes(wg,cfg)||[]).forEach(push); }
  ((extra&&extra.types)||[]).forEach(push);   // Prime Advantage-granted types (e.g. Champion, Malefic)
  return set;
}

function playTypes(u, cfg, extra){
  const types=playCollectTypes(u,cfg,extra); if(!types.length) return '';
  return `<div class="pm-section-h">UNIT TYPES</div>`+types.map(t=>{
    const txt=playRuleText(t);
    return `<div class="pm-ability"><div class="pm-ability-n">${t}</div>`+
      (txt?`<div class="pm-ability-t">${txt}</div>`:`<div class="pm-ability-t" style="color:var(--text-muted);font-style:italic;">No additional rules.</div>`)+`</div>`;
  }).join('');
}

function playStatBoxes(stats, modified){
  if(!stats) return '<div class="pm-statline-l" style="font-style:italic;">Stats not yet entered</div>';
  const keys = stats.vehicle ? ['M','BS','Front','Side','Rear','HP','TC']
                             : ['M','WS','BS','S','T','W','I','A','LD','CL','WP','IN','SAV','INV'];
  const divAfter = stats.vehicle ? new Set() : new Set(['A','IN']);  // physical | command | saves
  return '<div class="pm-stats">'+keys.map(k=>{
    const isMod = modified && modified.has(k);
    return `<div class="pm-stat"><span class="pm-sh">${k}</span><span class="pm-sv${isMod?' pm-mod':''}">${stats[k]??'—'}</span></div>`+
      (divAfter.has(k)?'<div class="pm-statdiv"></div>':'');
  }).join('')+'</div>';
}

function playStatLines(u, cfg, noDedup){
  const wg = activeWargear(u, cfg);
  const lines = [];
  if(wg.perModel){
    const champStats = (cfg.champUpgrade&&u.championUpgrade&&u.championUpgrade.stats)?u.championUpgrade.stats:u.championStats;
    const champLabel = (cfg.champUpgrade&&u.championUpgrade)?u.championUpgrade.label:(u.championLabel||'Champion');
    if(champStats) lines.push({label:champLabel, stats:champStats, kind:'champion'});
    if(u.modelStats) lines.push({label:(u.baseModelLabel||'Model'), stats:u.modelStats, kind:'model'});
    if(!lines.length){ const p=activeProfile(u,cfg); const s=(p&&p.stats)||u.stats; if(s) lines.push({label:'', stats:s, kind:'single'}); }
  } else {
    const prof = activeProfile(u, cfg);
    const stats = (prof&&prof.stats)?prof.stats:u.stats;
    if(stats) lines.push({label:'', stats, kind:'single'});
  }
  if(noDedup) return lines;
  // Collapse a champion/model pair that is identical in both label and stats.
  const seen=new Set(); const out=[];
  lines.forEach(l=>{ const k=l.label+'|'+JSON.stringify(l.stats); if(seen.has(k))return; seen.add(k); out.push(l); });
  return out;
}

// Apply a Prime Advantage's numeric stat deltas; returns new stats + the set of changed keys.
function applyPaDeltas(stats, deltas, cap){
  const out={...stats}; const modified=new Set();
  Object.keys(deltas||{}).forEach(k=>{
    const cur=out[k];
    if(typeof cur==='number'){ let v=cur+deltas[k]; if(cap!=null) v=Math.min(v,cap); if(v!==cur){ out[k]=v; modified.add(k); } }
  });
  return {stats:out, modified};
}

function playWeaponTable(weapons, melee){
  if(!weapons.length) return '';
  const cols = melee ? ['IM','AM','SM','AP','D'] : ['R','FP','RS','AP','D'];
  let h = `<div class="pm-wsec"><div class="pm-whead"><span></span><span class="pm-wname">${melee?'MELEE':'RANGED'}</span>`+
          cols.map(c=>`<span class="pm-wc">${c}</span>`).join('')+`</div>`;
  weapons.forEach(entry=>{
    const w=entry.w, count=entry.count||1;
    const rows = (w.profiles&&w.profiles.length) ? w.profiles.filter(p=>melee?p.melee:!p.melee) : [w];
    const isMulti = !!(w.profiles&&w.profiles.length);
    rows.forEach((p,ri)=>{
      const name = isMulti ? (w.label+' — '+p.name) : w.label;
      const c = melee
        ? [p.im??'—', p.am??'—', p.sm??'—', p.ap??'—', p.d??'—']
        : [ (p.range!==undefined?(typeof p.range==='number'?p.range+'"':p.range):'—'), p.fp??'—', p.rs??'—', p.ap??'—', p.d??'—'];
      const cnt = (ri===0 && count>1) ? count : '';
      h += `<div class="pm-wrow"><div class="pm-wtop"><span class="pm-wct">${cnt}</span><span class="pm-wname">${name}</span>`+
           c.map(v=>`<span class="pm-wc">${v}</span>`).join('')+`</div>`;
      // Special rules (have rules text → tappable) vs traits (keyword tags → static, no hover)
      const srStr = (p.specialRules&&p.specialRules!=='—') ? p.specialRules
                  : (!isMulti && w.specialRules && w.specialRules!=='—' ? w.specialRules : '');
      const traits = (p.rules&&p.rules.length) ? p.rules : (!isMulti && w.rules ? w.rules : []);
      const pills=[];
      if(srStr) srStr.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>
        pills.push(`<span class="pm-kw" data-rule="${s.replace(/"/g,'&quot;')}" onclick="playPop(event,this)">${s}</span>`));
      traits.forEach(t=>pills.push(`<span class="pm-wtrait">${t}</span>`));
      if(pills.length) h += `<div class="pm-wtraits">${pills.join('')}</div>`;
      h += `</div>`;
    });
  });
  return h+`</div>`;
}

function playCollectRules(u, cfg, extra){
  const prof = activeProfile(u, cfg);
  let rules = (prof&&prof.specialRules&&prof.specialRules.length)?prof.specialRules.slice():(u.specialRules||[]).slice();
  const wg = activeWargear(u, cfg);
  const activeIds = new Set([...(cfg.addons||[]), ...((cfg.champion&&cfg.champion.addons)||[])]);
  (cfg.chosen||[]).forEach(mc=>(mc.addons||[]).forEach(a=>activeIds.add(a)));
  const blocks = wg.perModel ? [wg.champion, wg.perModel] : [wg];
  blocks.forEach(blk=>{ if(!blk)return; (blk.addons||[]).forEach(a=>{
    if(a.grants&&a.grants.specialRules&&(a.always_on||activeIds.has(a.id))) a.grants.specialRules.forEach(r=>rules.push(r)); }); });
  ((extra&&extra.specialRules)||[]).forEach(r=>rules.push(r));
  return [...new Set(rules)];
}

function playAbilities(u, cfg, extra){
  const rules = playCollectRules(u, cfg, extra);
  if(!rules.length) return '';
  return `<div class="pm-section-h">SPECIAL RULES</div>`+rules.map(r=>{
    const txt = playRuleText(r);
    return `<div class="pm-ability"><div class="pm-ability-n">${r}</div>`+
           (txt?`<div class="pm-ability-t">${txt}</div>`:`<div class="pm-ability-t" style="color:var(--text-muted);font-style:italic;">Rule text not yet entered.</div>`)+`</div>`;
  }).join('');
}

  {id:"shieldwall", name:"Shieldwall!", needs:["Shield"],
    text:"<b>Restriction:</b> A majority of the models in this unit must have the Shield trait.<br><b>Trigger:</b> After the opponent declares this unit as the target of a Shooting attack, or at the Volley Fire step of a Charge.<br><b>Cost:</b> 1 Reaction Point.<br><b>Target:</b> This unit.<br><b>Effect:</b> This unit gains +1 Toughness for the remainder of this phase."},
