<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horus Heresy 3.0 — List Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a84c;--gold-light:#e8cc7a;--gold-dark:#8a6e2a;
  --parchment:#f5f0e4;--dark:#1a1510;--dark-mid:#2a2218;
  --card-bg:#f9f5ea;--slot-empty:#e8e0cc;--slot-filled:#c9a84c;
  --text-main:#2a2218;--text-muted:#7a6840;--red:#8b2020;--blue:#1a3a5c;
  --green:#2a6e2a;
}
body{background:var(--parchment);font-family:"Crimson Text",Georgia,serif;color:var(--text-main);min-height:100vh;font-size:17px;}
.app{padding:1.5rem;max-width:1000px;margin:0 auto;}
.app-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--gold);padding-bottom:.75rem;margin-bottom:1rem;gap:1rem;flex-wrap:wrap;}
.app-title{font-family:"Cinzel",serif;font-size:22px;color:var(--gold-dark);letter-spacing:.05em;}
.app-subtitle{font-size:15px;color:var(--text-muted);}
.header-btns{display:flex;gap:.5rem;}
.hbtn{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.06em;padding:5px 12px;border-radius:4px;cursor:pointer;border:1px solid var(--gold);background:var(--card-bg);color:var(--gold-dark);transition:background .15s;}
.hbtn:hover{background:var(--gold);color:var(--dark);}
.hbtn.save{background:var(--gold-dark);color:#f5f0e4;border-color:var(--gold-dark);}
.hbtn.save:hover{background:var(--gold);}
.ctrls{display:flex;gap:1rem;margin-bottom:1rem;align-items:flex-end;flex-wrap:wrap;}
.cg{display:flex;flex-direction:column;gap:4px;}
.cl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-family:"Cinzel",serif;}
select,input[type=number]{background:var(--card-bg);border:.5px solid var(--gold);color:var(--text-main);font-family:"Crimson Text",serif;font-size:16px;padding:4px 8px;border-radius:4px;min-width:120px;}
.pts-bar{display:flex;gap:1rem;align-items:center;background:var(--dark);padding:.5rem 1rem;border-radius:6px;margin-bottom:1rem;font-family:"Cinzel",serif;font-size:15px;}
.pts-lbl{color:var(--gold-light);}.pts-val{color:#fff;font-size:18px;font-weight:600;}
.pts-fill{flex:1;height:6px;background:#3a3020;border-radius:3px;overflow:hidden;}
.pts-inner{height:100%;background:var(--gold);border-radius:3px;transition:width .3s;}
.pts-inner.over{background:#c04040;}
.army{display:flex;flex-direction:column;gap:1rem;}
.dcard{background:#f3ead2;border:1px solid var(--gold);border-radius:8px;padding:.75rem 1rem;}
.dcard.primary{border-width:1.5px;border-color:var(--gold-dark);}
.chdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.75rem;gap:8px;}
.chdr-l{display:flex;flex-direction:column;gap:4px;}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ctitle{font-family:"Cinzel",serif;font-size:15px;color:var(--gold-dark);letter-spacing:.04em;}
.badge{font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:3px;font-family:"Cinzel",serif;white-space:nowrap;}
.bp{background:var(--gold-dark);color:#f5f0e4;}.ba{background:var(--blue);color:#c8dcf0;}
.bx{background:#3a3020;color:var(--gold-light);}.bw{background:var(--red);color:#f5c5c5;}
.bl{background:#4a1a1a;color:#f5c5c5;}
.rnote{font-size:13px;color:var(--red);font-style:italic;}
.ibadge{font-size:12px;background:#e8f0fa;color:var(--blue);border:.5px solid #a0b8d8;border-radius:3px;padding:2px 6px;font-family:"Cinzel",serif;}
.kwbtn{font-size:13px;margin:0 3px;padding:2px 9px;border-radius:3px;border:1px solid #a0b8d8;background:#f4f8fc;color:var(--blue);cursor:pointer;font-family:"Cinzel",serif;}
.kwbtn.sel{background:var(--blue);color:#fff;border-color:var(--blue);}
.rmbtn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:0 4px;}
.rmbtn:hover{color:var(--red);}
.unlock-info{margin-top:.5rem;font-size:13px;color:var(--text-muted);border-top:.5px solid #d4c88a;padding-top:.4rem;font-style:italic;}
.slots{display:flex;flex-wrap:wrap;gap:16px 10px;align-items:flex-start;}
.slots-grouped{flex-direction:column;gap:10px;}
.det-slot-row{display:flex;flex-wrap:wrap;gap:16px 10px;align-items:flex-start;width:100%;}
.scol{display:flex;flex-direction:column;align-items:center;width:88px;}
.sout{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ssvg{position:absolute;top:0;left:0;width:84px;height:84px;pointer-events:none;}
.sc{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);background:var(--slot-empty);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;position:relative;z-index:1;}
.sc:hover{border-color:var(--gold-dark);background:#ddd3b0;}.sc.filled{background:#241d14;border-color:var(--gold-dark);}.sc.filled:hover{background:#332918;}
.sc.missing{background:#c08080;border-color:var(--red);}
.sc img{width:54px;height:54px;object-fit:contain;display:block;}
.sc.filled img{filter:invert(72%) sepia(45%) saturate(450%) hue-rotate(2deg) brightness(95%) contrast(90%);}
.sui{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:3px;}
.sua{font-family:"Cinzel",serif;font-size:11px;color:#fff;text-align:center;line-height:1.15;max-width:54px;overflow:hidden;word-break:break-word;font-weight:600;}
.sup{font-size:11px;color:#f5e8c0;margin-top:2px;font-weight:600;}
.pchip-w{margin-top:3px;width:88px;}
.pchip{display:block;width:100%;background:var(--gold-dark);color:#f5f0e4;font-family:"Cinzel",serif;font-size:9px;border:.5px solid var(--gold);border-radius:3px;padding:2px 4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pchip.unset{background:transparent;color:var(--text-muted);border-color:var(--gold);}
.pchip:hover{background:var(--gold);}
.rlbl{font-size:13px;color:var(--text-muted);font-family:"Cinzel",serif;text-align:center;margin-top:4px;width:88px;word-break:break-word;line-height:1.2;}
.slot-name{font-family:"Crimson Text",serif;font-size:15px;font-weight:600;color:var(--text-main);text-align:center;line-height:1.15;margin-top:5px;width:88px;word-break:break-word;}
.slot-pts{font-size:13px;color:var(--red);text-align:center;margin-top:1px;line-height:1.1;}
.pool-area{margin-top:.5rem;}
.sec-title{font-family:"Cinzel",serif;font-size:14px;color:var(--gold-dark);margin-bottom:.5rem;letter-spacing:.05em;}
.pool{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem;}
.pb{background:var(--card-bg);border:.5px solid var(--gold);border-radius:4px;padding:5px 10px;font-family:"Crimson Text",serif;font-size:15px;cursor:pointer;color:var(--text-main);transition:background .15s;position:relative;}
.pb:hover:not(:disabled){background:#e8dfc0;}
/* ── Reference layer ── */
  .ref-tip{position:fixed;z-index:2000;background:#1a1610;border:.5px solid var(--gold);
  border-radius:4px;padding:8px 10px;min-width:220px;max-width:320px;
  font-family:"Crimson Text",serif;font-size:14px;color:#e8e0cc;
  pointer-events:none;white-space:normal;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.6);}
.ref-tip .stat-row{display:flex;gap:0;margin-bottom:3px;}
.ref-tip .stat-cell{flex:1;text-align:center;border:.5px solid #3a3020;padding:2px 0;}
.ref-tip .stat-cell .sh{font-size:10px;color:var(--gold);display:block;font-family:"Cinzel",serif;}
.ref-tip .stat-cell .sv{font-size:14px;font-weight:600;color:#e8e0cc;}
.ref-tip .weap-row{display:grid;grid-template-columns:auto 30px 30px 30px 25px 1fr;
  gap:2px 6px;font-size:13px;color:#e8e0cc;border-bottom:.5px solid #3a3020;padding:2px 0;}
.ref-tip .weap-hdr{font-size:10px;color:var(--gold);font-family:"Cinzel",serif;}
.rule-pill{display:inline-block;border-radius:3px;padding:1px 5px;font-size:12px;margin:1px;cursor:default;font-family:"Crimson Text",serif;}
.rule-pill.trait,.rule-pill.weapon-trait{background:#2a2010;border:.5px solid var(--gold);color:var(--gold-light);}
.rule-pill.special-rule{background:#1a2a1a;border:.5px solid #6a9a6a;color:#a8d4a8;cursor:help;}
.rule-pill.special-rule:hover{background:#243024;}
.rule-pill.unit-type{background:#1a2a3a;border:.5px solid #8ab4d4;color:#8ab4d4;cursor:help;}
.rule-pill.unit-type:hover{background:#1e3040;}
.rule-pill.psychic{background:#2a1a2e;border:.5px solid #b48ad4;color:#cba8e0;cursor:help;}
.rule-pill.psychic:hover{background:#33203a;}
.eye-btn{background:none;border:none;cursor:pointer;padding:0 4px;color:var(--gold);
  font-size:16px;opacity:.6;line-height:1;position:relative;}
.eye-btn:hover{opacity:1;}.pb:disabled{cursor:not-allowed;color:#aaa;border-color:#ccc;background:#f0ece0;}.pb:disabled .tip{color:var(--gold-light);background:var(--dark);border-color:var(--gold);}
.pb.apex{border-color:var(--blue);}.pb.wlord{border-color:var(--red);}
.pb.pb-unit{border-color:#5a8a6a;border-style:dashed;border-width:1px;}
.pb.pb-legion{border-color:#9a6fb8;border-width:1.5px;}
.pb .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:0;min-width:200px;max-width:280px;background:var(--dark);color:var(--gold-light);font-family:"Crimson Text",serif;font-size:13px;padding:7px 9px;border-radius:4px;border:.5px solid var(--gold);z-index:50;white-space:normal;line-height:1.5;pointer-events:none;opacity:1;}
.pb:hover .tip{display:block;}
/* Share panel */
.share-panel{background:var(--dark-mid);border:1px solid var(--gold);border-radius:8px;padding:1rem;margin-bottom:1rem;}
.share-title{font-family:"Cinzel",serif;font-size:15px;color:var(--gold-light);margin-bottom:.75rem;letter-spacing:.05em;}
.share-row{display:flex;gap:.5rem;margin-bottom:.75rem;align-items:flex-start;}
.share-row:last-child{margin-bottom:0;}
.share-label{font-size:13px;color:var(--text-muted);font-family:"Cinzel",serif;text-transform:uppercase;letter-spacing:.06em;min-width:60px;padding-top:6px;}
.code-box{flex:1;background:#0f0c08;border:.5px solid var(--gold-dark);color:var(--gold-light);font-family:monospace;font-size:13px;padding:6px 8px;border-radius:4px;word-break:break-all;min-height:38px;max-height:80px;overflow-y:auto;line-height:1.4;}
.code-input{flex:1;background:#0f0c08;border:.5px solid var(--gold-dark);color:var(--gold-light);font-family:monospace;font-size:13px;padding:6px 8px;border-radius:4px;word-break:break-all;min-height:38px;resize:vertical;}
.share-btn{font-family:"Cinzel",serif;font-size:12px;letter-spacing:.05em;padding:5px 10px;border-radius:4px;cursor:pointer;border:.5px solid var(--gold);background:transparent;color:var(--gold-light);white-space:nowrap;transition:background .15s;height:fit-content;}
.share-btn:hover{background:var(--gold-dark);}
.share-btn.green{border-color:#4a8a4a;color:#8ada8a;}
.copy-feedback{font-size:13px;color:#8ada8a;font-family:"Cinzel",serif;padding-top:6px;display:none;}
.copy-feedback.show{display:block;}
.import-err{font-size:13px;color:#f09090;font-family:"Cinzel",serif;padding-top:4px;display:none;}
.import-err.show{display:block;}
/* Modal */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;overflow-y:auto;padding:2rem 1rem;}
.mod{background:var(--parchment);border:1.5px solid var(--gold);border-radius:8px;padding:1.25rem;min-width:320px;max-width:520px;width:100%;font-family:"Crimson Text",serif;margin:0 auto;position:relative;z-index:1001;}
.mt{font-family:"Cinzel",serif;font-size:17px;color:var(--gold-dark);margin-bottom:.25rem;}
.ms{font-size:14px;color:var(--text-muted);margin-bottom:.75rem;font-style:italic;}
.mc{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}.mc:hover{color:var(--red);}
.uo{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:4px;cursor:pointer;border:.5px solid transparent;margin-bottom:4px;transition:background .15s;}
.uo:hover{background:#e8dfc0;border-color:var(--gold);}
.mdiv{border:none;border-top:.5px solid #d4c88a;margin:.75rem 0;}
.msec{font-family:"Cinzel",serif;font-size:13px;color:var(--gold-dark);margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase;}
/* Wargear modal sections */
.wg-section{margin-bottom:1rem;}
.wg-section-title{font-family:"Cinzel",serif;font-size:13px;color:var(--gold-dark);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;padding-bottom:.25rem;border-bottom:.5px solid #d4c88a;}
.wg-included{font-size:14px;color:var(--text-muted);font-style:italic;padding:4px 0;}
/* Slot exchange rows */
.slot-row{margin-bottom:.75rem;}
.slot-current{display:flex;align-items:center;justify-content:space-between;background:#ede5cc;border-radius:4px;padding:5px 8px;margin-bottom:4px;}
.slot-current.required-slot{background:#f5e0e0;border:.5px solid var(--red);}
.slot-current-name{font-size:15px;font-weight:600;}
.slot-current-pts{font-size:13px;color:var(--text-muted);}
.slot-reset{font-size:13px;color:var(--red);cursor:pointer;border:none;background:none;padding:0 4px;}
.slot-reset:hover{text-decoration:underline;}
.slot-option{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:4px;cursor:pointer;border:.5px solid transparent;margin-bottom:3px;transition:background .15s;font-size:15px;}
.slot-option:hover:not(.disabled){background:#e8dfc0;border-color:var(--gold);}
.slot-option.selected{background:#d4b86a;border-color:var(--gold-dark);}
.slot-option.disabled{opacity:.45;cursor:not-allowed;}
.slot-option-pts{font-size:13px;color:var(--text-muted);}
.slot-option-note{font-size:12px;color:var(--text-muted);font-style:italic;margin-left:6px;}
/* Pair exchange */
.pair-option{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:4px;cursor:pointer;border:.5px solid var(--blue);margin-bottom:.5rem;background:#f0f4fa;transition:background .15s;font-size:15px;}
.pair-option:hover{background:#dce8f8;}
.pair-option.selected{background:#c8dcf0;border-color:var(--blue);border-width:1px;}
.pair-label{display:flex;flex-direction:column;}
.pair-sublabel{font-size:12px;color:var(--text-muted);font-style:italic;}
/* Add-on toggles */
.addon-row{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:4px;margin-bottom:3px;font-size:15px;border:.5px solid transparent;}
.addon-row.available{cursor:pointer;transition:background .15s;}
.addon-row.available:hover{background:#e8dfc0;border-color:var(--gold);}
.addon-row.active{background:#d4b86a;border-color:var(--gold-dark);}
.addon-row.unavailable{opacity:.4;cursor:not-allowed;}
.addon-pts{font-size:13px;color:var(--text-muted);}
.addon-reason{font-size:12px;color:var(--text-muted);font-style:italic;margin-left:6px;}
.addon-check{width:14px;height:14px;border:1px solid var(--gold);border-radius:3px;background:var(--slot-empty);flex-shrink:0;}
.addon-check.on{background:var(--gold);}
.addon-check.on::after{content:"✓";font-size:10px;color:var(--dark);display:flex;align-items:center;justify-content:center;height:100%;}
/* Points total */
.mpt{font-family:"Cinzel",serif;font-size:16px;color:var(--gold-dark);margin-top:.75rem;text-align:right;padding-top:.5rem;border-top:.5px solid #d4c88a;}
.clrbtn{background:none;border:.5px solid var(--red);color:var(--red);border-radius:4px;padding:5px 12px;cursor:pointer;font-family:"Crimson Text",serif;font-size:15px;margin-top:.75rem;width:100%;}
.clrbtn:hover{background:#f5e5e5;}
.wt{font-size:13px;color:var(--red);font-style:italic;margin-bottom:.5rem;}
.po{padding:7px 10px;border-radius:4px;cursor:pointer;border:.5px solid transparent;margin-bottom:4px;transition:background .15s;}
.po:hover{background:#e8dfc0;border-color:var(--gold);}.po.sel{background:#d4b86a;border-color:var(--gold-dark);}
.pon{font-size:16px;font-weight:600;}.pod{font-size:13px;color:var(--text-muted);font-style:italic;margin-top:2px;}
/* ── Play Mode (during-play reference) ─────────────────────────── */
.pm-wrap{max-width:760px;margin:0 auto;}
.pm-topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--dark);border-bottom:1.5px solid var(--gold);padding:11px 14px;margin:-1.5rem -1.5rem 1rem;}
.pm-back{font-family:"Cinzel",serif;font-size:14px;color:var(--gold-light);background:none;border:1px solid var(--gold-dark);border-radius:4px;padding:6px 11px;cursor:pointer;white-space:nowrap;}
.pm-back:active{background:var(--gold-dark);}
.pm-pts{flex:1;text-align:center;font-family:"Cinzel",serif;font-size:16px;color:var(--gold-light);}
.pm-pts .over{color:#e08080;}
.pm-sec{margin-bottom:14px;border-radius:6px;overflow:hidden;border:1px solid var(--gold);}
.pm-sec-h{display:flex;align-items:center;justify-content:space-between;background:var(--gold-dark);color:#f5f0e4;font-family:"Cinzel",serif;font-size:17px;letter-spacing:.04em;padding:10px 14px;cursor:pointer;}
.pm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card-bg);border-top:1px solid var(--slot-empty);padding:11px 14px;cursor:pointer;}
.pm-row:active{background:var(--slot-empty);}
.pm-row-l{display:flex;flex-direction:column;gap:5px;min-width:0;}
.pm-uname{font-family:"Cinzel",serif;font-size:17px;color:var(--text-main);}
.pm-pills{display:flex;flex-wrap:wrap;gap:5px;}
.pm-pill{font-size:13px;padding:2px 9px;border-radius:10px;background:var(--gold-dark);color:#f5f0e4;white-space:nowrap;}
.pm-pill.pa{background:var(--blue);}
.pm-pill.ghost{background:transparent;border:1px solid var(--gold-dark);color:var(--gold-dark);}
.pm-chev-r{color:var(--gold-dark);font-size:18px;flex-shrink:0;}
.pm-dh{font-family:"Cinzel",serif;font-size:26px;color:var(--gold-dark);letter-spacing:.03em;margin:.2rem 0 .1rem;}
.pm-dsub{font-size:14px;color:var(--text-muted);margin-bottom:.6rem;}
.pm-dtraits{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.5rem;}
.pm-statline-l{font-family:"Cinzel",serif;font-size:13px;color:var(--text-muted);margin:.55rem 0 .25rem;letter-spacing:.04em;}
.pm-stats{display:flex;flex-wrap:wrap;gap:5px;align-items:stretch;margin-bottom:.3rem;}
.pm-statdiv{width:2px;background:var(--gold-dark);align-self:stretch;margin:-4px 4px;border-radius:1px;}
.pm-stat{display:flex;flex-direction:column;align-items:center;min-width:40px;background:var(--dark);border-radius:5px;padding:5px 5px;}
.pm-sh{font-family:"Cinzel",serif;font-size:10px;color:var(--gold);letter-spacing:.02em;}
.pm-sv{font-size:17px;color:#f5f0e4;font-weight:600;}
.pm-sv.pm-mod{color:#7ed957;text-shadow:0 0 4px rgba(126,217,87,.35);}
.pm-section-h{font-family:"Cinzel",serif;font-size:14px;letter-spacing:.06em;color:#f5f0e4;background:var(--gold-dark);padding:6px 12px;margin:1rem 0 .5rem;border-radius:4px;}
.pm-equip{background:var(--card-bg);border:1px solid var(--slot-empty);border-radius:5px;padding:9px 12px;font-size:16px;color:var(--text-main);margin-bottom:.3rem;line-height:1.4;}
.pm-wsec{margin-bottom:.7rem;}
.pm-whead,.pm-wtop{display:grid;grid-template-columns:1.7rem minmax(0,1fr) repeat(5,2.7rem);gap:2px;align-items:center;}
.pm-whead{background:var(--gold-dark);color:#f5f0e4;font-family:"Cinzel",serif;font-size:13px;padding:5px 10px;border-radius:4px 4px 0 0;letter-spacing:.02em;}
.pm-whead .pm-wc,.pm-wtop .pm-wc{text-align:center;}
.pm-wct{text-align:center;color:var(--gold-dark);font-weight:700;font-size:15px;}
.pm-wrow{background:var(--card-bg);border-bottom:1px solid var(--slot-empty);padding:7px 10px;}
.pm-wtop .pm-wname{font-size:16px;color:var(--text-main);min-width:0;overflow-wrap:anywhere;}
.pm-wtop .pm-wc{font-size:16px;color:var(--text-main);}
.pm-wtraits{margin-top:3px;margin-left:1.7rem;display:flex;flex-wrap:wrap;gap:4px;}
.pm-kw{font-size:12px;color:var(--blue);background:rgba(26,58,92,.08);border:.5px solid var(--blue);border-radius:9px;padding:1px 7px;cursor:pointer;letter-spacing:.02em;}
.pm-kw:active{background:var(--blue);color:#fff;}
.pm-wtrait{font-size:12px;color:var(--gold-dark);background:rgba(201,168,76,.16);border:.5px solid var(--gold);border-radius:9px;padding:1px 7px;letter-spacing:.02em;}
.pm-comp{background:var(--card-bg);border:1px solid var(--slot-empty);border-radius:5px;padding:8px 12px;font-size:16px;color:var(--text-main);margin-bottom:5px;line-height:1.4;}
.pm-ability{background:var(--card-bg);border:1px solid var(--slot-empty);border-left:3px solid var(--gold);border-radius:4px;padding:8px 12px;margin-bottom:6px;}
.pm-ability-n{font-family:"Cinzel",serif;font-size:15px;color:var(--gold-dark);margin-bottom:2px;}
.pm-ability-t{font-size:16px;color:var(--text-main);line-height:1.35;}
.pm-empty{color:var(--text-muted);font-style:italic;padding:2.5rem 1rem;text-align:center;}
.pm-react{background:var(--card-bg);border:1px solid var(--slot-empty);border-left:3px solid var(--blue);border-radius:4px;margin-bottom:6px;overflow:hidden;}
.pm-react-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;cursor:pointer;font-family:"Cinzel",serif;font-size:15px;color:var(--gold-dark);}
.pm-react-h:active{background:var(--slot-empty);}
.pm-react-chev{color:var(--blue);font-size:15px;}
.pm-react-t{padding:0 12px 10px;font-size:16px;color:var(--text-main);line-height:1.4;}
.pm-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.pm-rite-sub{border-top:1px solid var(--slot-empty);}
.pm-rite-subh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card-bg);padding:11px 14px;cursor:pointer;}
.pm-rite-subh:active{background:var(--slot-empty);}
.pm-rite-lab{font-family:"Crimson Text",serif;font-size:16px;color:var(--text-main);min-width:0;}
.pm-rite-lab b{font-family:"Cinzel",serif;font-size:14px;color:var(--gold-dark);letter-spacing:.02em;}
.pm-rite-chev{color:var(--gold-dark);font-size:16px;flex-shrink:0;}
.pm-rite-body{background:var(--card-bg);border-top:1px dashed var(--slot-empty);padding:10px 14px;font-size:16px;color:var(--text-main);line-height:1.45;}

/* ── Play Mode: phone tuning ───────────────────────────────────── */
@media (max-width: 560px){
  .app{padding:0.8rem;}
  .pm-topbar{margin:-0.8rem -0.8rem 0.8rem;padding:9px 10px;gap:6px;}
  .pm-topbar .pm-back{font-size:13px;padding:8px 9px;}
  .pm-pts{font-size:14px;}
  .pm-title{font-size:14px;max-width:42vw;}
  .pm-sec-h{font-size:15px;padding:11px 12px;}
  .pm-row{padding:12px;}
  .pm-uname{font-size:16px;}
  .pm-dh{font-size:22px;}
  .pm-dsub{font-size:13px;}
  .pm-stat{min-width:34px;padding:4px 3px;}
  .pm-sh{font-size:9px;}
  .pm-sv{font-size:15px;}
  .pm-statdiv{margin:-3px 2px;}
  .pm-whead,.pm-wtop{grid-template-columns:1.4rem minmax(0,1fr) repeat(5,2.05rem);}
  .pm-whead{font-size:10px;letter-spacing:0;padding:5px 8px;}
  .pm-wrow{padding:7px 8px;}
  .pm-wtop .pm-wname{font-size:15px;}
  .pm-wtop .pm-wc{font-size:12.5px;}
  .pm-wct{font-size:14px;}
  .pm-wtraits{margin-left:1.4rem;}
  .pm-section-h{font-size:13px;}
  .pm-comp,.pm-equip,.pm-ability-t{font-size:15px;}
  .ref-tip{max-width:calc(100vw - 24px);min-width:0;}
}
</style>

// ── Unit lookup ───────────────────────────────────────────────────────────────
const UNIT_LOOKUP = {};
function registerUnits(armyLists) {
  function walk(units) {
    if (!units) return;
    if (Array.isArray(units)) {
      units.forEach(u => {
        if (u && u.id) UNIT_LOOKUP[u.id] = u;
        if (u && u.profiles) u.profiles.forEach(p => { if (p.id) UNIT_LOOKUP[p.id] = p; });
      });
    } else if (typeof units === 'object') {
      Object.values(units).forEach(v => walk(v));
    }
  }
  // Walk SU (the main units object)
  Object.values(armyLists).forEach(role => {
    if (Array.isArray(role)) walk(role);
  });
}

// ── Serialise / deserialise ──────────────────────────────────────────────────
function serialise(state) {
  const data = {
    v:2,
    al:state.allegiance, lg:state.legion, pt:state.pts,
    ds:state.dets.map(d=>({
      did:d.did, pa:d.pa, pax:d.paExtra||{}, kw:d.keyword||null,
      sl:d.slots.map((u,i)=>u?{uid:u.id,cfg:d.cfgs[i]}:null),
      iu:(d.injectedUnits||[]).map((u,i)=>u?{uid:u.id,cfg:(d.injectedCfgs||[])[i]||{}}:null),
      ic:(d.injectedCfgs||[]).map(c=>c||{}),
    })),
  };
  return LZString.compressToEncodedURIComponent(JSON.stringify(data));
}

function deserialise(code) {
  try {
    const raw = LZString.decompressFromEncodedURIComponent(code);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || (data.v !== 1 && data.v !== 2)) return null;
    const dets = data.ds.map(d=>{
      const def = DD[d.did]; if (!def) return null;
      const slots = (d.sl||[]).map(s=>{
        if (!s) return null;
        const u = UNIT_LOOKUP[s.uid];
        return u || {id:s.uid,name:"⚠ Unknown unit",basePts:0,minSize:1,maxSize:1,wargear:{},_missing:true};
      });
      while (slots.length < def.slots.length) slots.push(null);
      const cfgs = (d.sl||[]).map(s=>s?(s.cfg||defaultCfg({minSize:1})):{});
      while (cfgs.length < def.slots.length) cfgs.push({});
      return {iid:d.did+"_"+Math.random().toString(36).slice(2),did:d.did,slots,cfgs,pa:d.pa||{},paExtra:d.pax||{},keyword:d.kw||null,
        injectedUnits:(d.iu||[]).map(s=>s?UNIT_LOOKUP[s.uid]||null:null),
        injectedCfgs:(d.ic||[]).map(c=>c||{})};
    }).filter(Boolean);
    return {allegiance:data.al,legion:data.lg,pts:data.pt,dets,modal:null};
  } catch(e){return null;}
}

// Get injected slots for a detachment (from units with injectSlots + logistical benefit PA)
function getInjectedSlots(det) {
  const injected = [];
  // From units with injectSlots
  det.slots.forEach(u => {
    if (u && u.injectSlots) {
      u.injectSlots.forEach(inj => {
        for (let n = 0; n < inj.count; n++) {
          injected.push({r: inj.r, p: false, injected: true, note: inj.note||null,
                         armyList: inj.armyList||null});
        }
      });
    }
  });
  // From slot-adding prime advantages (Logistical Benefit, Rewards of Treachery)
  const def = DD[det.did];
  def.slots.forEach((s, i) => {
    const paId = det.pa[i];
    if ((paId==='logistical' || paId==='rewards_of_treachery' || paId==='logisticae') && det.slots[i]) {
      const role = ((det.paExtra||{})[i]||{}).logisticalRole || null;
      if (role) injected.push({r: role, p: false, injected: true,
        logistical: paId==='logistical', coopt: paId==='rewards_of_treachery', logisticae: paId==='logisticae'});
    }
  });
  // Sync injectedUnits/Cfgs arrays to match count
  while ((det.injectedUnits||[]).length < injected.length) {
    (det.injectedUnits = det.injectedUnits||[]).push(null);
    (det.injectedCfgs  = det.injectedCfgs ||[]).push({});
  }
  // Trim if count decreased
  if ((det.injectedUnits||[]).length > injected.length) {
    det.injectedUnits = (det.injectedUnits||[]).slice(0, injected.length);
    det.injectedCfgs  = (det.injectedCfgs ||[]).slice(0, injected.length);
  }
  return injected;
}

// Sire of the <Legion>: when a Primarch carrying a primeAllTroops condition is in the
// army and the Primary Detachment's Troops slots satisfy it, those filled Troops slots
// are treated as Prime Slots. Returns {iid, set:Set<slotIndex>} or null.
function sireTroopsPrime(){
  let cond=null;
  for(const d of ST.dets){
    for(const u of (d.slots||[])){ if(u && u.primeAllTroops){ cond=u.primeAllTroops; break; } }
    if(cond) break;
    for(const u of (d.injectedUnits||[])){ if(u && u.primeAllTroops){ cond=u.primeAllTroops; break; } }
    if(cond) break;
  }
  if(!cond) return null;
  const pri = ST.dets.find(d=>DD[d.did] && DD[d.did].cat==="primary");
  if(!pri) return null;
  const def=DD[pri.did];
  const filled=[];
  def.slots.forEach((s,i)=>{ if(s.r==="Troops"){ const u=pri.slots[i]; if(u) filled.push(u.name); } });
  const need = cond.count || def.slots.filter(s=>s.r==="Troops").length;
  if(filled.length < need) return null;
  if(cond.allowed && !filled.every(n=>cond.allowed.includes(n))) return null;
  if(cond.require){
    for(const k in cond.require){
      if(filled.filter(n=>n===k).length < cond.require[k]) return null;
    }
  }
  const set=new Set();
  def.slots.forEach((s,i)=>{ if(s.r==="Troops" && pri.slots[i]) set.add(i); });
  return {iid:pri.iid, set};
}

function getUnlocks(){
  // HighCommand and Command slots in ANY detachment grant unlocks (Crusade Primary,
  // Officer Cadre, etc.): HighCommand → Apex unlock; Command → Aux unlock (or Apex via
  // a Delegatus/commandUnlockUpgrade, or X Aux via Officer of the Line (X)).
  let ao=0,ax=0;
  ST.dets.forEach(det=>{
    const def=DD[det.did]; if(!def)return;
    def.slots.forEach((s,i)=>{
      if(!det.slots[i])return;
      if(det.pa[i]==="special_assignment")return;
      if(s.r==="HighCommand") ao++;
      if(s.r==="Command"){
        if(det.slots[i].commandUnlockUpgrade) ao++;
        else {
          const u = det.slots[i];
          const cfg = det.cfgs[i]||{};
          const prof = (u.profiles&&u.profiles.length) ? (u.profiles.find(pr=>pr.id===(cfg.profileId||u.profiles[0].id))||u.profiles[0]) : null;
          const unitSpecial = (prof&&prof.specialRules)||u.specialRules||[];
          const ootl = unitSpecial.find(r=>r.startsWith("Officer of the Line ("));
          if(ootl) ax += parseInt(ootl.match(/\((\d+)\)/)?.[1]||"1");
          else ax++;
        }
      }
    });
  });
  return{ao,ax};
}

function getUsed(){
  let a=0,b=0;
  ST.dets.forEach(d=>{const c=DD[d.did].cat;if(c==="apex")a++;if(c==="auxiliary")b++;});
  return{a,b};
}

function canAdd(cat){
  const{ao,ax}=getUnlocks();const{a,b}=getUsed();
  if(cat==="apex")      return a<ao;
  if(cat==="auxiliary") return(a+b)<(ao+ax);
  if(cat==="warlord")   return ST.pts>=3000&&!ST.dets.find(d=>DD[d.did].cat==="warlord");
  if(cat==="lordsofwar")return !ST.dets.find(d=>DD[d.did].cat==="lordsofwar");
  return false;
}

function totalPts(){
  let t=0;
  ST.dets.forEach(d=>{
    d.slots.forEach((u,i)=>{if(u)t+=cp(u,d.cfgs[i]||{});});
    (d.injectedUnits||[]).forEach((u,i)=>{if(u)t+=cp(u,(d.injectedCfgs||[])[i]||{});});
  });
  return t;
}
function detPts(d){let t=0;d.slots.forEach((u,i)=>{if(u)t+=cp(u,d.cfgs[i]||{});});return t;}

function addDet(did){
  const d=DD[did];
  ST.dets.push({iid:did+"_"+Date.now(),did,
    slots:Array(d.slots.length).fill(null),
    cfgs:Array(d.slots.length).fill(null).map(()=>({})),
    pa:{}, paExtra:{}, keyword:null,
    injectedUnits:[], injectedCfgs:[]});
  saveAndRender();
}
function remDet(iid){ ST.dets=ST.dets.filter(d=>d.iid!==iid); saveAndRender(); }
function setDetKeyword(iid, kw){
  const d=ST.dets.find(x=>x.iid===iid); if(!d) return;
  const def=DD[d.did]; if(!def||!def.keyword_choice) return;
  d.keyword = (d.keyword===kw) ? null : kw;
  // Clear units in keyword-restricted slots that no longer match the chosen word.
  if(def.keyword_roles){
    def.slots.forEach((s,i)=>{
      if(def.keyword_roles.includes(s.r) && d.slots[i]){
        const ok = d.keyword && d.slots[i].name.toLowerCase().includes(d.keyword.toLowerCase());
        if(!ok){ d.slots[i]=null; d.cfgs[i]={}; }
      }
    });
  }
  saveAndRender();
}

// Returns the active profile for a unit given current cfg (profile selector)
// Returns the active type/subtype info for a unit
function activeType(u, cfg) {
  const prof = activeProfile(u, cfg);
  if (prof && (prof.type || prof.subtypes)) return prof;
  return u || {};
}

function activeProfile(u, cfg) {
  if (!u.profiles || !u.profiles.length) return null;
  const sel = (cfg && cfg.profileId) || u.profiles[0].id;
  return u.profiles.find(p => p.id === sel) || u.profiles[0];
}

// Returns the active wargear block for a unit
// ---- Legion-specific weapon exchanges ----------------------------------
// Army-wide swap rules injected at render time based on ST.legion, so we
// never hand-edit every unit. Two shapes:
//   type:"uniform"          whole-unit swap of an included weapon, all models
//                           together (reuses the uniform slot machinery), +pts/model
//   type:"modelConditional" per-model swap offered only to models of given
//                           types; if the model has the source weapon by default
//                           it's a free added swap (Case A); if it can pick the
//                           source as an option, the target is added to that slot
//                           at the same price (Case B), collapsing the two steps.
const LEGION_SWAPS = [
  { legion:"Iron Warriors", type:"uniform",
    from:"Bolt Pistol", to:"Shrapnel Pistol", toId:"shrapnel_pistol", pts:2 },
  { legion:"Iron Warriors", type:"uniform",
    from:"Bolter", to:"Shrapnel Bolter", toId:"shrapnel_bolter", pts:3 },
  { legion:"Iron Warriors", type:"modelConditional", requireTypes:["Command","Champion"],
    from:"Thunder Hammer", to:"Graviton Crusher", toId:"graviton_crusher", costMode:"matchSource" },
  // Graviton Mace (and other list-specific items) stay on their wargear lists via the
  // existing req:{legion}+requires_weapon mechanism (optionVisible) — not registry rows.
  { legion:"Alpha Legion", type:"grant", requireTypes:["Command","Champion"],
    add:"Venom Spheres", addId:"venom_spheres", pts:5 },
  { legion:"Alpha Legion", type:"modelConditional", requireTypes:["Command","Champion","Sergeant"],
    fromTrait:"Power", to:"Power Dagger", toId:"power_dagger" },
  { legion:"Ultramarines", type:"modelConditional", requireTypes:["Command","Champion","Sergeant"],
    from:"Power Axe", to:"Legatine Axe", toId:"legatine_axe", pts:5 },
  { legion:"Ultramarines", type:"grant", requireTypes:["Command","Champion"],
    add:"Argyrum Pattern Boarding Shield", addId:"argyrum_boarding_shield", pts:15,
    grants:{traits:["Shield"], types:["Heavy"]} },
  { legion:"Sons of Horus", type:"modelConditional", requireTypes:["Command","Champion"],
    from:"Bolter", to:"Banestrike Bolter", toId:"banestrike_bolter", pts:5 },
  { legion:"Sons of Horus", type:"modelConditional", requireTypes:["Command","Champion"],
    from:"Combi-bolter", to:"Banestrike Combi-bolter", toId:"banestrike_combi_bolter", pts:5 },
  { legion:"Sons of Horus", type:"modelConditional", onlyUnit:"e_seeker_squad",
    from:"Kraken Bolter", to:"Banestrike Bolter", toId:"banestrike_bolter", pts:0 },
  { legion:"Sons of Horus", type:"modelConditional", onlyUnit:"e_veteran_tactical_squad",
    from:"Bolter", to:"Banestrike Bolter", toId:"banestrike_bolter", pts:5 },
  // Power axe → Carsoran variants: offered to any model that has or can take a power axe,
  // priced at the power axe's own cost +5 (axe) / +10 (tabar), per the graviton-hammer pattern.
  { legion:"Sons of Horus", type:"modelConditional", from:"Power Axe", to:"Carsoran Power Axe",   toId:"carsoran_power_axe",   costMode:"matchSource", costAdd:5 },
  { legion:"Sons of Horus", type:"modelConditional", from:"Power Axe", to:"Carsoran Power Tabar", toId:"carsoran_power_tabar", costMode:"matchSource", costAdd:10 },
];

// A unit "counts as" a legion if it adopts the army legion (generic Legion
// Astartes units) or is that-legion-specific. Excludes Mechanicum/automata etc.
function unitAdoptsLegion(u, legion){
  if(!u || ST.legion!==legion) return false;
  const tr=u.traits||[];
  return tr.includes("[Legiones Astartes]") || tr.includes(legion);
}
// Types/traits granted by a model's *selected* addons (e.g. Argyrum shield → Heavy/Shield).
function addonGrantedTypes(blockWg, modelCfg){
  const out=[];
  ((modelCfg&&modelCfg.addons)||[]).forEach(id=>{
    const a=((blockWg&&blockWg.addons)||[]).find(x=>x.id===id);
    if(a&&a.grants&&Array.isArray(a.grants.types)) a.grants.types.forEach(t=>out.push(t));
  });
  return out;
}
function addonGrantedTraits(blockWg, modelCfg){
  const out=[];
  ((modelCfg&&modelCfg.addons)||[]).forEach(id=>{
    const a=((blockWg&&blockWg.addons)||[]).find(x=>x.id===id);
    if(a&&a.grants&&Array.isArray(a.grants.traits)) a.grants.traits.forEach(t=>out.push(t));
  });
  return out;
}
function blockModelTypes(u, block, isTop, cfg, modelCfg){
  // Union of model types AND subtypes, so a "Command"/"Champion" requirement matches
  // whether the data encodes it as a modelType (e.g. Praetor) or a profile subtype
  // (e.g. Centurion, whose Command lives in profile.subtypes).
  const s=new Set();
  (u.modelTypes||[]).forEach(t=>s.add(t));
  (u.subtypes||[]).forEach(t=>s.add(t));
  if(isTop){
    const at=activeType(u, cfg||{})||{};
    if(at.type) s.add(at.type);
    (at.subtypes||[]).forEach(t=>s.add(t));
  } else if(block){
    (block.modelTypes||[]).forEach(t=>s.add(t));
    (block.subtypes||[]).forEach(t=>s.add(t));
  }
  // Equipment-granted types from this model's selected addons (only those it doesn't already have).
  addonGrantedTypes(block, modelCfg).forEach(t=>s.add(t));
  return [...s];
}

// Every model type-set in the unit (across perModel/champion, or the single-model
// type list). Used to test composition requirements like "Infantry models only".
function unitModelTypeSets(u){
  const wg = (u && u.wargear) || {};
  const sets = [];
  if(wg.perModel && wg.perModel.modelTypes) sets.push(wg.perModel.modelTypes);
  if(wg.champion && wg.champion.modelTypes) sets.push(wg.champion.modelTypes);
  if(!sets.length && u && u.modelTypes) sets.push(u.modelTypes);
  return sets;
}
function unitInfantryOnly(u){
  const sets = unitModelTypeSets(u);
  return sets.length>0 && sets.every(ts => (ts||[]).includes("Infantry"));
}

// Does the unit carry the Unique type anywhere (unit traits/modelTypes or any profile)?
function unitIsUnique(u){
  const flat = [...(u.traits||[]), ...(u.modelTypes||[])];
  if (flat.some(t=>/\bunique\b/i.test(t))) return true;
  return (u.profiles||[]).some(p => [...(p.subtypes||[]), ...(p.modelTypes||[])].some(t=>/\bunique\b/i.test(t)));
}

// Eligible to be co-opted by "Rewards of Treachery": a faction-specific unit from a Legion
// OTHER than Alpha Legion, with no [Legiones Astartes] wildcard, and not Unique.
function unitCooptEligible(u){
  const t = u.traits||[];
  return !!(u.req && u.req.legion && u.req.legion!=="Alpha Legion")
    && !t.includes("[Legiones Astartes]")
    && !t.includes("Alpha Legion")
    && !unitIsUnique(u);
}

// Does a weapon label resolve to a profile carrying the given trait (e.g. "Power")?
function labelHasTrait(label, trait){
  if(!label) return false;
  const k = weaponKeyFromLabel(label);
  return !!(k && (WEAPONS[k].rules||[]).includes(trait));
}

// Is a Prime Advantage available for the unit currently filling the slot?
// Advantages with no `req` are always offered; gated ones must pass every clause.
// Does this unit's definition include a model with the given type anywhere
// (top-level, any profile, champion or per-model block)? Used to gate trait-locked PAs.
function unitHasType(u, type){
  if(!u) return false;
  if((u.modelTypes||[]).includes(type)) return true;
  for(const p of (u.profiles||[])){ if(p.type===type || (p.subtypes||[]).includes(type)) return true; }
  const wg=u.wargear||{};
  if(((wg.champion&&wg.champion.modelTypes)||[]).includes(type)) return true;
  if(((wg.perModel&&wg.perModel.modelTypes)||[]).includes(type)) return true;
  return false;
}
// A PA flagged oncePerDet may appear on only one slot per detachment.
// (det.pa is an object keyed by slot index, so iterate its values.)
function paOncePerDetTaken(a, det, slotIdx){
  if(!a.oncePerDet) return false;
  const pa = det.pa || {};
  return Object.keys(pa).some(k => String(k)!==String(slotIdx) && pa[k]===a.id);
}

function paAvailable(a, u){
  if(!a.req) return true;
  // Allegiance is army-wide state, so it gates regardless of slot occupancy.
  if(a.req.allegiance && ST.allegiance !== a.req.allegiance) return false;
  // Unit-composition clauses require a unit in the slot to evaluate.
  if(a.req.legion){ if(!u || !unitAdoptsLegion(u, a.req.legion)) return false; }
  if(a.req.infantryOnly){ if(!u || !unitInfantryOnly(u)) return false; }
  if(a.req.hasType){ if(!u || !unitHasType(u, a.req.hasType)) return false; }
  return true;
}

function injectLegionSwaps(u, wg, cfg){
  if(!u || !wg || !ST.legion) return wg;
  const rows = LEGION_SWAPS.filter(r=>unitAdoptsLegion(u, r.legion)
    && (!r.onlyUnit || r.onlyUnit===u.id)
    && (!r.onlyUnits || r.onlyUnits.includes(u.id)));
  if(!rows.length) return wg;
  const cloneBlock = (blk)=> blk ? ({...blk,
    included_slots:[...(blk.included_slots||[])],
    slots:(blk.slots||[]).map(s=>({...s, options:[...(s.options||[])]})),
    addons:[...(blk.addons||[])],
  }) : blk;
  const out = {...wg,
    included_slots:[...(wg.included_slots||[])],
    slots:(wg.slots||[]).map(s=>({...s, options:[...(s.options||[])]})),
    addons:[...(wg.addons||[])],
    perModel: cloneBlock(wg.perModel),
    champion: cloneBlock(wg.champion),
  };
  let touched=false;
  const doBlock = (blk, types)=>{
    if(!blk) return;
    rows.forEach(r=>{
      const sid = "ls_"+r.toId;
      if(r.type==="uniform"){
        if((blk.included_slots||[]).includes(r.from)){
          blk.included_slots = blk.included_slots.filter(x=>x!==r.from);
          if(!blk.slots.some(s=>s.id===sid)){
            blk.slots.push({ id:sid, label:r.from, uniform:true, uniformGroup:r.toId, legionSwap:true,
              options:[{ id:r.toId, label:r.to, pts:r.pts||0, req:{legion:r.legion} }] });
            touched=true;
          }
        } else {
          // `from` is the default label of an existing swap slot (e.g. a sergeant's
          // pistol slot). Add the swap as an option on that slot so the model can take it.
          const s = (blk.slots||[]).find(s=>s.label===r.from);
          if(s && !s.options.some(o=>o.id===r.toId)){
            s.options.push({ id:r.toId, label:r.to, pts:r.pts||0, legionSwap:true, uniformGroup:r.toId, req:{legion:r.legion} });
            s.swapGroup = r.toId;
            touched=true;
          }
        }
      } else if(r.type==="modelConditional"){
        if(r.requireTypes && r.requireTypes.length && !r.requireTypes.some(t=>types.includes(t))) return;
        // Source matched by exact label, or by a trait (e.g. any Power weapon).
        const isSource = (label)=> r.fromTrait ? labelHasTrait(label, r.fromTrait) : (label===r.from);
        // Total cost of the swapped weapon = cost to obtain the source + the exchange premium.
        // Premium is the flat "+N pts" (pts), or the delta on top of the source cost (costAdd)
        // when costMode is "matchSource". A model that already carries the source pays 0 for it.
        const premium = (r.costMode==="matchSource") ? (r.costAdd||0) : (r.pts||0);
        const swapCost = (srcPrice)=> (srcPrice||0) + premium;
        // Case A2: the source is a slot's DEFAULT weapon → add the target as an option there.
        const defSlot = (blk.slots||[]).find(s=>isSource(s.label) && s.label!==r.to);
        if(defSlot){
          if(!defSlot.options.some(o=>o.id===r.toId)){
            defSlot.options.push({ id:r.toId, label:r.to, legionSwap:true, req:{legion:r.legion}, pts:swapCost(0) });
            touched=true;
          }
          return;
        }
        const incl = (blk.included_slots||[]).find(x=>isSource(x));
        if(incl===r.to) return;          // already carries the target
        if(incl){
          // Case A: an included weapon is the source → dedicated swap slot.
          blk.included_slots = blk.included_slots.filter(x=>x!==incl);
          if(!blk.slots.some(s=>s.id===sid)){
            blk.slots.push({ id:sid, label:incl, legionSwap:true,
              options:[{ id:r.toId, label:r.to, pts:swapCost(0), req:{legion:r.legion} }] });
            touched=true;
          }
          return;
        }
        // Case B: source obtainable only as an option/list pick. Offer the target at
        // (source cost + premium), so it works for any model that *could* take the source.
        let found=null;
        for(const s of (blk.slots||[])){
          for(const o of (s.options||[])){
            if(o.label && isSource(o.label)){ found={slot:s, price:(o.pts||0)}; break; }
            if(o.list){
              const items=((WARGEAR_LISTS[o.list]||{}).items||[]);
              const it = items.find(x=>isSource(x.label));
              if(it){ found={slot:s, price:(o.pts||0)+(it.pts||0)}; break; }
            }
          }
          if(found) break;
        }
        // Skip if that slot already defaults to the target (no real exchange).
        if(found && found.slot.label !== r.to && !found.slot.options.some(o=>o.id===r.toId)){
          found.slot.options.push({ id:r.toId, label:r.to, legionSwap:true, req:{legion:r.legion},
            pts: swapCost(found.price) });
          touched=true;
        }
      } else if(r.type==="grant"){
        // Optional ADDED wargear (not a swap) for qualifying models, via the addon
        // mechanism: "may be given <item> for +N points per model".
        if((r.requireTypes||[]).some(t=>types.includes(t))){
          if(!blk.addons.some(a=>a.id===r.addId)){
            blk.addons.push({ id:r.addId, label:r.add, pts:r.pts||0, legionSwap:true, req:{legion:r.legion}, grants:r.grants||undefined });
            touched=true;
          }
        }
      }
    });
  };
  if(out.perModel || out.champion){
    doBlock(out.perModel, blockModelTypes(u, out.perModel, false, cfg));
    doBlock(out.champion, blockModelTypes(u, out.champion, false, cfg, cfg&&cfg.champion));
  } else {
    doBlock(out, blockModelTypes(u, out, true, cfg, cfg));
  }
  return touched ? out : wg;
}

function activeWargear(u, cfg) {
  if (!u) return {};
  const prof = activeProfile(u, cfg);
  let base = (prof && prof.wargear) ? prof.wargear : (u.wargear || {});
  // Optional champion upgrade (e.g. Evocatus Intendant): swap in its wargear block.
  if (cfg && cfg.champUpgrade && u.championUpgrade && u.championUpgrade.wargear) {
    base = {...base, champion: u.championUpgrade.wargear};
  }
  return injectLegionSwaps(u, base, cfg);
}

function defaultPerModelCfg() {
  return {slots:{}, addons:[], pairExchange:null};
}

function defaultCfg(u){
  const size = u.minSize;
  const chosen = u.wargear && u.wargear.perModel
    ? Array(Math.max(0, size - 1)).fill(null).map(() => ({slots:{}, addons:[], pairExchange:null}))
    : [];
  return {size, pairExchange:null, slots:{}, addons:[], champion:{slots:{},addons:[],pairExchange:null}, chosen};
}

// A "uniform" squad has no distinct leader — its champion and base models share one label.
// Such units are modelled with the champion/model split for storage, but should render as a
// single numbered group (Model 1..N), with one merged type group and one composition group.
function isUniform(u){ return !!(u && u.championLabel && u.baseModelLabel && u.championLabel===u.baseModelLabel); }

function assignById(uid){
  const u=UNIT_LOOKUP[uid]; if(!u)return;
  const{iid,i}=ST.modal;
  const d=ST.dets.find(x=>x.iid===iid);
  d.slots[i]=u; d.cfgs[i]=defaultCfg(u);
  ST.modalUnit={iid,i,inj:false}; ST.modal={mode:"customise",iid,i}; saveAndRender();
}

// Is a unit blocked by a unique rule already in the army?
function unitUniqueBlocked(u, currentIid, currentSlotIdx) {
  if (!u.uniqueRule) return false;
  return ST.dets.some(d =>
    d.slots.some((s, si) => {
      if (s && s.uniqueRule === u.uniqueRule) {
        // Don't block against the slot we're currently filling
        if (d.iid === currentIid && si === currentSlotIdx) return false;
        return true;
      }
      return false;
    })
  );
}

function clearSlot(iid,i){
  const d=ST.dets.find(x=>x.iid===iid);
  d.slots[i]=null; d.cfgs[i]={}; ST.modal=null; ST.modalState={}; saveAndRender();
}

// Remove a unit from an injected (PA-added) slot — its unit lives in injectedUnits, not slots.
function clearInjected(iid,ii){
  const d=ST.dets.find(x=>x.iid===iid);
  if(!d) return;
  d.injectedUnits=d.injectedUnits||[]; d.injectedCfgs=d.injectedCfgs||[];
  d.injectedUnits[ii]=null; d.injectedCfgs[ii]={};
  ST.modal=null; ST.modalState={}; saveAndRender();
}

// When the injected-slot customise modal is open, wargear setters must read/write the
// injected unit's arrays (injectedUnits/injectedCfgs) instead of the regular slots/cfgs.
// This proxy transparently redirects `slots`→injectedUnits and `cfgs`→injectedCfgs so the
// existing setters work unchanged; otherwise it returns the detachment as-is.
function modalDet(d){
  if(!d || !ST.modal) return d;
  const inj = (ST.modalUnit && ST.modalUnit.inj) || ST.modal.mode==='inj_customise';
  if(!inj) return d;
  d.injectedUnits=d.injectedUnits||[]; d.injectedCfgs=d.injectedCfgs||[];
  return new Proxy(d, {
    get(t,p){ return p==='slots'?t.injectedUnits : p==='cfgs'?t.injectedCfgs : t[p]; },
    set(t,p,v){ if(p==='slots') t.injectedUnits=v; else if(p==='cfgs') t.injectedCfgs=v; else t[p]=v; return true; }
  });
}
// The unit currently being edited (ST.modalUnit) persists across sub-pickers. Injected-slot
// units share the same index space as regular slots, so without this a sub-picker or a
// mode-reset would re-address the regular slot at that index (the wrong unit). unitModalObj
// rebuilds the unit modal in the correct mode; modalDet keys its proxy off ST.modalUnit.inj.
function unitModalObj(iid,i){ return (ST.modalUnit && ST.modalUnit.inj) ? {mode:'inj_customise',iid,ii:i} : {mode:'customise',iid,i}; }
function backToUnit(iid,i){ ST.modal = unitModalObj(iid,i); render(); }

function setSize(iid,i,v){
  const d=modalDet(ST.dets.find(x=>x.iid===iid));
  const u=d.slots[i]; if(!u)return;
  const s=Math.max(u.minSize,Math.min(u.maxSize,parseInt(v)||u.minSize));
  const cfg={...(d.cfgs[i]||{}),size:s};
  // Sync chosen array for perModel units
  const wg=activeWargear(u,cfg);
  if(wg && wg.perModel){
    const chosenCount = s - 1;
    const existing = cfg.chosen || [];
    if(existing.length < chosenCount){
      cfg.chosen = [...existing, ...Array.from({length:chosenCount-existing.length},()=>defaultPerModelCfg())];
    } else if(existing.length > chosenCount){
      cfg.chosen = existing.slice(0, chosenCount);
    }
    // Uniform slots: newly-added models inherit the unit-wide selection (held on the champion)
    const uniformIds=(wg.perModel.slots||[]).filter(sl=>sl.uniform).map(sl=>sl.id);
    if(uniformIds.length){
      const champSlots=(cfg.champion&&cfg.champion.slots)||{};
      cfg.chosen=(cfg.chosen||[]).map(mc=>{
        const slots={...(mc.slots||{})};
        uniformIds.forEach(sid=>{ if(champSlots[sid]!==undefined) slots[sid]=champSlots[sid]; });
        return {...mc, slots};
      });
    }
  }
  d.cfgs[i]=cfg; saveAndRender();
}

function setPairExchange(iid,i,pairId){
  const d=modalDet(ST.dets.find(x=>x.iid===iid));
  const cfg=d.cfgs[i]||{}; const u=d.slots[i];
  const wg=activeWargear(u,cfg);
  if(cfg.pairExchange===pairId){
    d.cfgs[i]={...cfg,pairExchange:null};
  } else {
    const pair=(wg.pairs||[]).find(p=>p.id===pairId)||{};
    const newAddons=(cfg.addons||[]).filter(aid=>{
      const addon=(wg.addons||[]).find(a=>a.id===aid);
      if(!addon)return true;
      if(addon.excludes_pair&&addon.excludes_pair.includes(pairId))return false;
      return true;
    });
    d.cfgs[i]={...cfg,pairExchange:pairId,slots:{},addons:newAddons};
  }
  saveAndRender();
}

function setSlotOption(iid,i,slotId,optId){
  const d=modalDet(ST.dets.find(x=>x.iid===iid));
  const cfg=d.cfgs[i]||{};
  const slots={...(cfg.slots||{})};
  if(slots[slotId]===optId){ delete slots[slotId]; }
  else { slots[slotId]=optId; }
  // clear addons that need this slot to be default
  const u=d.slots[i];
  const wg2=activeWargear(u,cfg);
  const newAddons=(cfg.addons||[]).filter(aid=>{
    const addon=(wg2.addons||[]).find(a=>a.id===aid);
    if(!addon)return true;
    if(addon.requires_slot_default&&addon.requires_slot_default===slotId&&slots[slotId])return false;
    return true;
  });
  d.cfgs[i]={...cfg, slots, addons:newAddons};
  saveAndRender();
}

function toggleAddon(iid,i,addonId){
  const d=modalDet(ST.dets.find(x=>x.iid===iid));
  const cfg=d.cfgs[i]||{}; const u=d.slots[i];
  const wg=activeWargear(u,cfg);
  const addon=(wg.addons||[]).find(a=>a.id===addonId);
  if(!addon)return;
  let addons=[...(cfg.addons||[])];
  if(addons.includes(addonId)){
    addons=addons.filter(id=>id!==addonId);
  } else {
    if(addon.exclusive) addons=addons.filter(id=>!addon.exclusive.includes(id));
    addons.push(addonId);
  }
  // Clear slots that are now inactive due to addon state change
  const newSlots={...(cfg.slots||{})};
  (wg.slots||[]).forEach(slot=>{
    const wasActive=isSlotActive(slot, cfg.addons||[]);
    const nowActive=isSlotActive(slot, addons);
    if(wasActive!==nowActive) delete newSlots[slot.id];
  });
  d.cfgs[i]={...cfg, addons, slots:newSlots};
  saveAndRender();
}

function spk(){
  const cx=34,cy=34,r=26,n=14;let pts="";
  for(let i=0;i<n;i++){const a1=(i/n)*Math.PI*2-Math.PI/2;const a2=((i+.5)/n)*Math.PI*2-Math.PI/2;pts+=`${cx+Math.cos(a1)*(r+7)},${cy+Math.sin(a1)*(r+7)} ${cx+Math.cos(a2)*r},${cy+Math.sin(a2)*r} `;}
  return `<svg class="ssvg" viewBox="0 0 68 68"><polygon points="${pts.trim()}" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/></svg>`;
}
function stip(slots){
  const co={};slots.forEach(s=>{const k=s.r+(s.p?"*":"");co[k]=(co[k]||0)+1;});
  return Object.entries(co).map(([k,v])=>{const p=k.endsWith("*");const r=p?k.slice(0,-1):k;return v+"× "+r.replace(/([A-Z])/g," $1").trim()+(p?" (Prime)":"");}).join(", ");
}
function countUnitId(uid){ return ST.dets.reduce((s,d)=>s+d.slots.filter(u=>u&&u.id===uid).length,0); }
function withinMaxPerUnit(def){
  if(def.max_per_unit_any){
    const total = def.max_per_unit_any.reduce((s,n)=>{
      const isId = n.startsWith("cmd_")||n.startsWith("hc_");
      return s + (isId ? countUnitId(n) : countUnitName(n));
    },0);
    return countDetachment(def.id) < total;
  }
  if(!def.max_per_unit)return true;
  // max_per_unit can be a unit ID (string) or a unit name
  const perUnitCount = def.max_per_unit.startsWith("cmd_") || def.max_per_unit.startsWith("hc_")
    ? countUnitId(def.max_per_unit)
    : countUnitName(def.max_per_unit);
  return countDetachment(def.id) < perUnitCount;
}
function disReason(def,cat){
  if(!canAdd(cat))return "No unlock available.";
  if(def.req){
    if(def.req.legion&&ST.legion!==def.req.legion)return "Req legion: "+def.req.legion+".";
    if(def.req.allegiance&&ST.allegiance!==def.req.allegiance)return "Requires "+def.req.allegiance+" allegiance.";
    if(def.req.any_unit&&!def.req.any_unit.some(id=>allUnitIds().includes(id)||allNames().includes(id)))return "Req unit in army: "+def.req.any_unit.map(id=>{const u=UNIT_LOOKUP[id];return u?u.name:id;}).join(" or ")+".";
  }
  if(!withinMaxPerUnit(def)){
    const cap = def.max_per_unit_any ? def.max_per_unit_any.join("/") : def.max_per_unit;
    return "Limit reached (1 per "+cap+" in army).";
  }
  return "";
}

function weaponKeyFromLabel(label) {
  const findExact = (s) => {
    let k = Object.keys(WEAPONS).find(x => WEAPONS[x].label === s);
    if (k) return k;
    const sl = s.toLowerCase();
    return Object.keys(WEAPONS).find(x => WEAPONS[x].label.toLowerCase() === sl) || null;
  };
  let k = findExact(label);
  if (k) return k;
  // Mount/count prefixes describe where/how-many, not the weapon itself; strip them to
  // resolve to the underlying weapon profile. Try depluralized form too. Conservative:
  // returns null (no tooltip) rather than mis-resolving when no base profile exists.
  const tryFind = (s) => {
    let h = findExact(s);
    if (h) return h;
    if (s.endsWith('ies')) { h = findExact(s.slice(0,-3)+'y'); if (h) return h; }
    if (s.endsWith('s'))   { h = findExact(s.slice(0,-1));     if (h) return h; }
    return null;
  };
  const prefixes = ['Centreline-mounted ','Centreline ','Turret-mounted ','Turret ',
    'Hull (Front)-mounted ','Hull (Front) ','Hull (Rear)-mounted ','Hull (Rear) ',
    'Hull (Left)-mounted ','Hull (Left) ','Hull (Right)-mounted ','Hull (Right) ',
    'Sponson-mounted ','Pintle-mounted ','Co-axial '];
  const counts = [/^One /,/^Two /,/^Three /,/^Four /,/^Five /,/^Six /,/^Twelve /,/^\d+ /,/^Paired /];
  let s = label, prev;
  do {
    prev = s;
    for (const p of prefixes) if (s.startsWith(p)) { s = s.slice(p.length); break; }
    for (const c of counts) if (c.test(s)) { s = s.replace(c,''); break; }
    const hit = tryFind(s);
    if (hit) return hit;
  } while (s !== prev);
  return null;
}

}

  // Multi-profile weapon — split ranged vs melee profiles into their own tables
  if (w.profiles && w.profiles.length) {
    const renderGroup = (profs, melee, first) => {
      if (!profs.length) return '';
      const headers = melee
        ? ['Profile','IM','AM','SM','AP','D','Special Rules']
        : ['Profile','Range','FP','RS','AP','D','Special Rules'];
      const n = headers.length;

        <thead><tr>${headers.map((h,i)=>`<th style="${thStyle(i,n)}">${h}</th>`).join('')}</tr></thead>
        <tbody>`;
      profs.forEach(p => {
        const c1 = melee ? (p.im??'—')
                         : (p.range !== undefined ? (typeof p.range==='number' ? p.range+'"' : p.range) : '—');
        const c2 = melee ? (p.am??'—') : (p.fp??'—');
        const c3 = melee ? (p.sm??'—') : (p.rs??'—');
        const vals2 = [p.name, c1, c2, c3, p.ap??'—', p.d??'—', p.specialRules||'—'];
        t += '<tr>'+vals2.map((v,i)=>`<td style="${tdStyle(i,n)}">${v}</td>`).join('')+'</tr>';
        if (p.rules && p.rules.length) {
          const pills = p.rules.map(r =>
            '<span class="rule-pill weapon-trait" data-rule="'+r.replace(/"/g,'&quot;')+'">'+r+'</span>'
          ).join(' ');
          t += `<tr><td colspan="${n}" style="padding:2px 0 4px 4px;">${pills}</td></tr>`;
        }
      });
      return t + '</tbody></table>';
    };
    const ranged = w.profiles.filter(p => !p.melee);
    const melee  = w.profiles.filter(p => p.melee);
    let out = `<div style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:5px;">${w.label}</div>`;
    out += renderGroup(ranged, false, true);
    out += renderGroup(melee, true, ranged.length===0);
    return out;
  }

  const headers = isMelee
    ? ['IM','AM','SM','AP','D','Special Rules']
    : ['Range','FP','RS','AP','D','Special Rules'];
  const vals = isMelee
    ? [w.im??'—', w.am??'—', w.sm??'—', w.ap??'—', w.d??'—', w.specialRules||'—']
    : [rng, w.fp??'—', w.rs??'—', w.ap??'—', w.d??'—', w.specialRules||'—'];
  const n = headers.length;
  return `<div style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:5px;">${w.label}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px;">

      <tbody><tr>${vals.map((v,i)=>`<td style="${tdStyle(i,n)}">${v}</td>`).join('')}</tr></tbody>
    </table>
    ${(w.rules||[]).length ? '<div style="margin-top:5px;">'+ruleLinks+'</div>' : ''}`;
}

function ruleTipHtml(name) {
  // Resolve text for an exact name from RULES (preferred) or EQUIPMENT; blank/"..." counts as unresolved.
  function resolve(nm){
    const e = RULES[nm] || EQUIPMENT[nm];
    if (e && e.text != null && String(e.text).trim() && String(e.text).trim() !== '...') return e.text;
    return null;
  }
  let text = resolve(name);
  // Parameterized fallback: an entry like "Bulky (5)" with no exact text inherits the
  // base rule "Bulky", substituting the parenthetical value into any {X} placeholder.
  if (text === null) {
    const m = name.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (m) {
      const baseText = resolve(m[1]);
      if (baseText !== null) text = String(baseText).replace(/\{X\}/g, m[2]);
    }
  }
  if (text === null) text = 'Rule text not yet entered.';
  return `<div style="font-family:'Cinzel',serif;font-size:12px;color:var(--gold);margin-bottom:3px;">${name}</div>
    <div style="font-size:13px;">${text}</div>`;
}

  const champGear = [
    ...(champWg.included_slots||[]),
    ...(champWg.slots||[]).map(s => s.label),
  ];
  // Use perModel gear if available (more representative), else unit root
  const allGear = pmGear.length ? [...new Set([...pmGear, ...(pmWg.included_slots||[])])] : gearParts;
  const gear = allGear.length ? allGear.join(', ') : '—';
  const prof0 = u.profiles && u.profiles[0];
  // Traits — unit level
  const tipTraits = u.traits||[];
  // Types — from first profile or unit root
  const tipTypes = prof0 ? [prof0.type,...(prof0.subtypes||[])].filter(Boolean) : (u.modelTypes||[]);
  // Special rules — from first profile or unit root
  const tipSpecial = (prof0&&prof0.specialRules)||u.specialRules||[];
  // Stats from profiles[0], champion, or unit root
  const stats = u.stats || (prof0&&prof0.stats) || u.championStats || u.modelStats || (u.wargear&&u.wargear.champion&&u.wargear.champion.stats) || null;
  function resolveTrait(t){if(t==='[Allegiance]')return ST.allegiance||'Loyalist';if(t==='[Legiones Astartes]')return ST.legion||'Legion';return t;}
  const traitPills = tipTraits.map(t=>'<span class="rule-pill trait">'+resolveTrait(t)+'</span>').join(' ');
  const typePills  = tipTypes.map(t=>'<span class="rule-pill unit-type" data-rule="'+t.replace(/"/g,'&quot;')+'">'+t+'</span>').join(' ');
  const srPills    = tipSpecial.map(r=>'<span class="rule-pill special-rule" data-rule="'+r.replace(/"/g,'&quot;')+'">'+r+'</span>').join(' ');
  return `<div style="font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-bottom:4px;">${u.name}</div>
    ${statBlockHtml(stats)}
    <div style="margin-top:5px;font-size:12px;color:var(--gold);">Base wargear</div>
    <div style="font-size:13px;color:#e8e0cc;margin-bottom:4px;">${gear}</div>
    ${traitPills ? '<div style="margin-top:4px;">'+traitPills+'</div>' : ''}
    ${typePills  ? '<div style="margin-top:3px;">'+typePills+'</div>'  : ''}
    ${srPills    ? '<div style="margin-top:3px;">'+srPills+'</div>'    : ''}`;
}

// ── Wargear list helpers ─────────────────────────────────────────────────────
// Find an item by ID across all wargear lists
function findListItem(itemId) {
  for (const list of Object.values(WARGEAR_LISTS)) {
    const found = list.items.find(i => i.id === itemId);
    if (found) {
      // Apply labelPrefix if the list defines one
      if (list.labelPrefix && !found._prefixed) {
        return {...found, label: list.labelPrefix + found.label, _prefixed:true};
      }
      return found;
    }
  }
  return null;
}

// Resolve a chosen option ID → option object, checking inline then wargear lists
function resolveOption(slot, optId) {
  if (!optId) return null;
  const inline = (slot.options || []).find(o => o.id === optId);
  if (inline) return inline;
  const faction = getFactionOptions(slot).find(o => o.id === optId);
  if (faction) return faction;
  return findListItem(optId);
}

// Get all weapon labels available to a unit (included + slot options + list items)
function unitWeaponLabels(u, activeCfg) {
  const labels = new Set();
  // Collect all wargear blocks across the unit and all its profiles
  const wgBlocks = [];
  if (u.wargear) wgBlocks.push(u.wargear);
  if (u.profiles) u.profiles.forEach(p => { if (p.wargear) wgBlocks.push(p.wargear); });
  wgBlocks.forEach(wg => {
    (wg.included_slots || wg.included || []).forEach(l => labels.add(l));
    (wg.slots || []).forEach(slot => {
      (slot.options || []).forEach(opt => {
        labels.add(opt.label);
        if (opt.list) {
          const list = WARGEAR_LISTS[opt.list];
          if (list) list.items.forEach(item => labels.add(item.label));
        }
      });
    });
  });
  return labels;
}

// Visibility checks for options
function optionLegionOk(opt) {
  if (!opt.req) return true;
  if (opt.req.legion && opt.req.legion !== ST.legion) return false;
  if (opt.req.legion_any && !opt.req.legion_any.includes(ST.legion)) return false;
  return true;
}
// Whether a UNIT passes the Legion filter (hard filter — hidden if legion mismatch).
// Allegiance is NOT checked here: allegiance-locked units still SHOW under the right
// Legion, but are disabled with a red badge in the picker (see pick modal).
function unitLegionOk(u) {
  if (!u.req) return true;
  if (u.req.legion && u.req.legion !== ST.legion) return false;
  if (u.req.legion_any && !u.req.legion_any.includes(ST.legion)) return false;
  return true;
}
// Allegiance gate, evaluated separately (soft block).
function unitAllegianceBlocked(u) {
  return !!(u.req && u.req.allegiance && u.req.allegiance !== ST.allegiance);
}
function optionWeaponOk(opt, u) { return !opt.requires_weapon || unitWeaponLabels(u).has(opt.requires_weapon); }
function optionSubtypeOk(opt, u, cfg) {
  if (!opt.requires_subtypes) return true;
  // Check unit root subtypes first, then active profile subtypes
  const rootSubtypes = u.subtypes || [];
  const profileSubtypes = (activeType(u, cfg||{})||{}).subtypes || [];
  const allSubtypes = [...new Set([...rootSubtypes, ...profileSubtypes])];
  return opt.requires_subtypes.some(s => allSubtypes.includes(s));
}
function optionVisible(opt, u, cfg)  { return optionLegionOk(opt) && optionWeaponOk(opt, u) && optionSubtypeOk(opt, u, cfg); }

// Points calculation — handles ptsPerModel
// Two-handed weapon support: returns the option (and its slot) occupying `slotId`, if any.
function slotConsumedBy(mwg, mc, slotId) {
  for (const s of (mwg.slots||[])) {
    const chosen = (mc.slots||{})[s.id];
    if (!chosen) continue;
    const opt = (s.options||[]).find(o => o.id === chosen);
    if (opt && (opt.consumes_slots||[]).includes(slotId)) return { option: opt, slotId: s.id };
  }
  return null;
}

function cp(u, cfg) {
  if (!u) return 0;
  cfg = cfg || {};
  const modelCount = cfg.size || u.minSize || 1;
  const profile = activeProfile(u, cfg);
  let p = u.basePts + (profile ? profile.pts : 0);
  p += Math.max(0, (modelCount - (u.minSize||1))) * (u.ptsPerModel || 0);
  const wg = activeWargear(u, cfg);
  if (!wg) return p;
  if (cfg.pairExchange) {
    const pair = (wg.pairs || []).find(x => x.id === cfg.pairExchange);
    if (pair) p += pair.pts;
  }
  const lockedSlots = cfg.pairExchange
    ? ((wg.pairs||[]).find(x=>x.id===cfg.pairExchange)||{}).replaces||[]
    : [];
  (wg.slots || []).forEach(slot => {
    if (lockedSlots.includes(slot.id)) return;
    if (!isSlotActive(slot, cfg.addons||[])) return;
    const chosen = (cfg.slots||{})[slot.id];
    if (!chosen) return;
    const opt = resolveOption(slot, chosen);
    if (!opt) return;
    p += opt.ptsPerModel ? (opt.pts||0)*modelCount : (opt.pts||0);
  });
  (cfg.addons||[]).forEach(id => {
    const addon = (wg.addons||[]).find(a=>a.id===id);
    if (addon) p += addon.ptsPerModel ? (addon.pts||0)*modelCount : (addon.pts||0);
  });
  // Numeric addons
  // Per-model costs (Champion + Chosen)
  if (wg.perModel) {
    const calcModelCost = (mc, mwg) => {
      let mp = 0;
      if (!mc || !mwg) return mp;
      if (mc.pairExchange) {
        const pair = (mwg.pairs||[]).find(x=>x.id===mc.pairExchange);
        if (pair) mp += pair.pts;
      }
      const lockedSlots = mc.pairExchange
        ? ((mwg.pairs||[]).find(x=>x.id===mc.pairExchange)||{}).replaces||[] : [];
      (mwg.slots||[]).forEach(slot => {
        if (lockedSlots.includes(slot.id)) return;
        if (slotConsumedBy(mwg, mc, slot.id)) return; // occupied by a two-handed weapon; its cost counts in its own slot
        const chosen = (mc.slots||{})[slot.id];
        if (!chosen) return;
        const opt = resolveOption(slot, chosen);
        if (opt) mp += opt.pts||0;
      });
      (mc.addons||[]).forEach(id => {
        const addon = (mwg.addons||[]).find(a=>a.id===id);
        if (!addon) return;
        if (addon.list || addon.listFixed) {
          // list-based addon: base cost on addon.pts + chosen item's pts
          const chosenItem = (mc.addonListChoices||{})[id];
          if (chosenItem) {
            const item = addon.listFixed
              ? (addon.listFixed.find(x=>x.id===chosenItem))
              : findListItem(chosenItem);
            mp += (addon.pts||0) + (item ? (item.pts||0) : 0);
          }
        } else {
          mp += addon.pts||0;
        }
      });
      return mp;
    };
    p += calcModelCost(cfg.champion, wg.champion);
    if (cfg.champUpgrade && u.championUpgrade) p += u.championUpgrade.pts||0;
    (cfg.chosen||[]).forEach(mc => { p += calcModelCost(mc, wg.perModel); });
  }

  // Sergeant costs
  if (wg.sergeant && cfg.sergeant) {
    const sc = cfg.sergeant;
    const sgtwg = wg.sergeant;
    if (sc.pairExchange) {
      const pair = (sgtwg.pairs||[]).find(x=>x.id===sc.pairExchange);
      if (pair) p += pair.pts;
    }
    const sgtLocked = sc.pairExchange
      ? ((sgtwg.pairs||[]).find(x=>x.id===sc.pairExchange)||{}).replaces||[]
      : [];
    (sgtwg.slots||[]).forEach(slot => {
      if (sgtLocked.includes(slot.id)) return;
      const chosen = (sc.slots||{})[slot.id];
      if (!chosen) return;
      const opt = resolveOption(slot, chosen);
      if (opt) p += opt.pts||0;
    });
    (sc.addons||[]).forEach(id => {
      const addon = (sgtwg.addons||[]).find(a=>a.id===id);
      if (addon) p += addon.pts||0;
    });
  }
  return p;
}

// Format pts label for display (handles ptsPerModel)
function fmtPts(opt, modelCount) {
  if (!opt || !opt.pts) return "free";
  if (opt.ptsPerModel) return `+${opt.pts} pts/model (${opt.pts * modelCount} total)`;
  return `+${opt.pts} pts`;
}

// Cost label for an as-yet-unresolved slot option. A list picker shows "Variable"
// (the real cost depends on which item is chosen) rather than "free".
function optPtsLabel(opt, modelCount) {
  if (opt && opt.list) return opt.pts ? `+${opt.pts} pts + variable` : "Variable";
  return fmtPts(opt, modelCount);
}

  else { newMc.pairExchange=pairId; newMc.slots={}; newMc.addons=(newMc.addons||[]).filter(id=>{

function slotLocked(wg, cfg, slotId) {
  if (!cfg.pairExchange) return false;
  const pair = (wg.pairs||[]).find(x=>x.id===cfg.pairExchange);
  return pair && (pair.replaces||[]).includes(slotId);
}

function slotLabel(wg, cfg, slot) {
  const locked = slotLocked(wg, cfg, slot.id);
  if (locked) {
    const pair = (wg.pairs||[]).find(x=>x.id===cfg.pairExchange);
    return {name: pair.label, pts:null, isLocked:true};
  }
  const chosen = (cfg.slots||{})[slot.id];
  if (!chosen) return {name: slot.label, pts:0, isDefault:true};
  const opt = (slot.options||[]).find(o=>o.id===chosen);
  return {name: opt?opt.label:chosen, pts: opt?opt.pts:0};
}

function sharedOptionUsed(wg, cfg, optId, excludeSlotId) {
  if (!wg||!wg.slots) return false;
  const lockedSlots = cfg.pairExchange
    ? ((wg.pairs||[]).find(x=>x.id===cfg.pairExchange)||{}).replaces||[]
    : [];
  return (wg.slots||[]).some(slot => {
    if (slot.id===excludeSlotId) return false;
    if (lockedSlots.includes(slot.id)) return false;
    return (cfg.slots||{})[slot.id]===optId;
  });
}

function isSlotActive(slot, activeAddons) {
  // A slot is active (visible) unless it requires a specific addon to be active
  if (!slot.requires_addon) return true;
  return activeAddons.includes(slot.requires_addon);
}

function getFactionOptions(slot) {
  if (!slot.factionOptions) return [];
  return slot.factionOptions.filter(opt => !opt.req || !opt.req.legion || opt.req.legion === ST.legion);
}

// Is `chosen` (a direct option id OR a list-item id) a valid pick in this slot?
function optionValidInSlot(slot, chosen) {
  if (!slot) return false;
  if ((slot.options||[]).some(o => o.id === chosen)) return true;      // direct option present on this profile
  for (const o of (slot.options||[])) {                                // or a list item from a list this slot offers
    if (o.list) { const L = WARGEAR_LISTS[o.list]; if (L && (L.items||[]).some(it => it.id === chosen)) return true; }
  }
  return false;
}

function switchProfile(iid, i, profileId) {
  const d = modalDet(ST.dets.find(x=>x.iid===iid));
  const u = d.slots[i];
  const prof = (u.profiles||[]).find(p=>p.id===profileId);
  if (!prof) return;
  const cfg = d.cfgs[i]||{};
  const fresh = {...defaultCfg(u), size: cfg.size||u.minSize, profileId};
  // Carry over selections that remain valid on the destination profile.
  // Guardrails: the slot must exist on the new profile AND the chosen swap must be a valid option/list-item there.
  const newWg = activeWargear(u, fresh);
  const newSlots = newWg.slots || [];
  const keptSlots = {};
  Object.entries(cfg.slots||{}).forEach(([slotId, chosen]) => {
    const ns = newSlots.find(s => s.id === slotId);
    if (optionValidInSlot(ns, chosen)) keptSlots[slotId] = chosen;
  });
  fresh.slots = keptSlots;
  const newAddonIds = new Set((newWg.addons||[]).map(a => a.id));
  fresh.addons = (cfg.addons||[]).filter(id => newAddonIds.has(id));
  if (cfg.pairExchange && (newWg.pairs||[]).some(p => p.id === cfg.pairExchange)) fresh.pairExchange = cfg.pairExchange;
  if (cfg.addonListChoices) {
    const kept = {};
    Object.entries(cfg.addonListChoices).forEach(([aid, v]) => { if (newAddonIds.has(aid)) kept[aid] = v; });
    fresh.addonListChoices = kept;
  }
  d.cfgs[i] = fresh;
  ST.modal = unitModalObj(iid,i);
  saveAndRender();
}

function setPerModelSlot(iid, i, modelKey, slotId, optId) {
  const d = modalDet(ST.dets.find(x=>x.iid===iid));
  const cfg = d.cfgs[i]||{};
  const u=d.slots[i]; const wg=activeWargear(u,cfg);
  // Uniform slot: one selection shared by every model in the unit (e.g. Support squad
  // heavy/special weapon — "every Model must have the same item"). Setting it on any
  // model sets it on all of them (and clearing it clears all).
  const champSlotDef=((wg.champion&&wg.champion.slots)||[]).find(s=>s.id===slotId);
  const pmSlotDef=((wg.perModel&&wg.perModel.slots)||[]).find(s=>s.id===slotId);
  if((champSlotDef&&champSlotDef.uniform)||(pmSlotDef&&pmSlotDef.uniform)){
    const ugroup = (pmSlotDef||champSlotDef).uniformGroup;
    const clicked = modelKey==='champion' ? (cfg.champion||{}) : (cfg.chosen||[])[parseInt(modelKey)]||{};
    const turnOff = (clicked.slots||{})[slotId]===optId;
    const apply = (mc, blk) => {
      mc = mc || {slots:{}, addons:[], pairExchange:null};
      const slots={...(mc.slots||{})};
      // (1) The uniform slot itself: real for models that have it; a harmless phantom
      // carrier on models that don't (e.g. the champion) so resize propagation can read it.
      if(turnOff){ delete slots[slotId]; }
      else {
        slots[slotId]=optId;
        const picked=((blk&&blk.slots)||[]).flatMap(s=>s.options||[]).find(o=>o.id===optId);
        if(picked&&picked.consumes_slots) picked.consumes_slots.forEach(cs=>{delete slots[cs];});
      }
      // (2) Models that carry this swap in a DIFFERENT slot (e.g. a sergeant's pistol slot):
      // auto-follow only when that slot is on its default; preserve any manual override.
      if(ugroup){
        const gslot=((blk&&blk.slots)||[]).find(s=>s.swapGroup===ugroup && s.id!==slotId);
        if(gslot){
          if(turnOff){ if(slots[gslot.id]===optId) delete slots[gslot.id]; }
          else { if(slots[gslot.id]===undefined) slots[gslot.id]=optId; }
        }
      }
      return {...mc, slots};
    };
    const champion=apply(cfg.champion, wg.champion);
    const chosen=(cfg.chosen||[]).map(mc=>apply(mc, wg.perModel));
    d.cfgs[i]={...cfg, champion, chosen};
    saveAndRender();
    return;
  }
  let mc = modelKey==='champion' ? (cfg.champion||{}) : (cfg.chosen||[])[parseInt(modelKey)];
  if(!mc) mc = {slots:{}, addons:[], pairExchange:null};
  const slots={...(mc.slots||{})};
  if(slots[slotId]===optId){ delete slots[slotId]; }
  else {
    slots[slotId]=optId;
    // Two-handed weapon: clear any slots it occupies so a stale pistol/shield choice doesn't linger
    const mwg = modelKey==='champion' ? (wg.champion||{}) : (wg.perModel||{});
    const picked = (mwg.slots||[]).flatMap(s=>s.options||[]).find(o=>o.id===optId);
    if (picked && picked.consumes_slots) picked.consumes_slots.forEach(cs => { delete slots[cs]; });
  }
  const newMc={...mc,slots};
  if(modelKey==='champion'){ d.cfgs[i]={...cfg,champion:newMc}; }
  else { const chosen=[...(cfg.chosen||[])]; chosen[parseInt(modelKey)]=newMc; d.cfgs[i]={...cfg,chosen}; }
  saveAndRender();
}

function toggleSgtAddon(iid, i, addonId) {
  const d = ST.dets.find(x=>x.iid===iid);
  const cfg = d.cfgs[i]||{};
  const sc = cfg.sergeant||{};
  const u = d.slots[i];
